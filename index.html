<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A–Z Marathon Overlay</title>
  <style>
    :root {
      --bg: #070a12;
      --surface: #0e1422;
      --fg: #e8f0ff;
      --muted: #7a8aa8;
      --border: #1e2a42;
      --primary: #00c6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    body.overlay-mode {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    button { cursor: pointer; font: inherit; border: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .control {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.15rem); font-weight: 800; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin-top: 8px; max-width: 38rem; line-height: 1.5; font-size: 0.95rem; }
    .grid { display: grid; gap: 18px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.15fr 0.85fr; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row h2 { font-size: 1.05rem; }
    .nav-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
      display: grid; place-items: center;
      font-size: 20px;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      min-height: 170px;
      align-items: center;
    }
    .picks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .pick-btn {
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
    }
    .pick-btn.active {
      border-color: var(--pick, var(--primary));
      box-shadow: 0 0 12px color-mix(in srgb, var(--pick, var(--primary)) 35%, transparent);
      background: color-mix(in srgb, var(--pick, var(--primary)) 16%, #0a0e18);
    }
    .url-row { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 640px) { .url-row { flex-direction: row; } }
    .url-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .url-box code {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #dce8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy-btn {
      height: 48px; padding: 0 18px;
      border-radius: 12px;
      font-weight: 700; font-size: 14px;
      color: #071018;
      white-space: nowrap;
    }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .letters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 480px) { .letters { grid-template-columns: repeat(5, 1fr); } }
    .letter-btn {
      min-height: 56px;
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 8px 10px;
      color: var(--fg);
    }
    .letter-btn strong { display: block; font-size: 18px; font-weight: 800; line-height: 1; }
    .letter-btn span {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.2;
    }
    .letter-btn .multi {
      display: inline-block;
      margin-top: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .how ol {
      margin-left: 1.15rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .how code {
      background: var(--bg);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .game-overlay {
      position: relative;
      display: flex;
      align-items: center;
      gap: 28px;
      width: min(920px, 100%);
      padding: 22px 32px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 35%, transparent);
      border-radius: var(--g-radius, 18px);
      background: color-mix(in srgb, var(--g-surface) 92%, transparent);
      color: var(--g-fg);
      box-shadow:
        0 0 40px color-mix(in srgb, var(--g-glow) 18%, transparent),
        inset 0 0 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      animation: fadeUp .55s ease-out both;
    }
    .game-overlay.compact { gap: 16px; padding: 14px 18px; max-width: 720px; }
    .game-overlay[data-flair="military"]::before,
    .game-overlay[data-flair="military"]::after {
      content: ""; position: absolute; width: 18px; height: 18px;
      border-color: var(--g-primary); pointer-events: none; z-index: 2;
    }
    .game-overlay[data-flair="military"]::before {
      top: 6px; left: 6px; border-top: 2px solid; border-left: 2px solid;
    }
    .game-overlay[data-flair="military"]::after {
      right: 6px; bottom: 6px; border-right: 2px solid; border-bottom: 2px solid;
    }
    .flair-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .letter-box {
      position: relative; z-index: 1; flex-shrink: 0;
      display: grid; place-items: center;
      width: 110px; height: 110px;
      border: 2px solid color-mix(in srgb, var(--g-primary) 55%, transparent);
      border-radius: var(--g-letter-radius, 16px);
      background: linear-gradient(145deg, var(--g-panel), color-mix(in srgb, var(--g-surface) 80%, black));
      box-shadow: 0 0 24px color-mix(in srgb, var(--g-glow) 40%, transparent);
      animation: pulseGlow 2.8s ease-in-out infinite;
    }
    .compact .letter-box { width: 76px; height: 76px; }
    .letter-box span {
      font-weight: 800; font-size: 4.6rem; line-height: 1; letter-spacing: -2px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--g-primary) 70%, white), var(--g-primary));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--g-glow) 50%, transparent));
    }
    .compact .letter-box span { font-size: 3rem; }
    .cover {
      position: relative; z-index: 1; flex-shrink: 0;
      width: 130px; height: 174px; overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 25%, transparent);
      box-shadow: 0 8px 24px rgba(0,0,0,.55);
      background: var(--g-panel);
      animation: floatY 4s ease-in-out infinite;
    }
    .compact .cover { width: 86px; height: 116px; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover .ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 2.5rem; font-weight: 800;
      color: color-mix(in srgb, var(--g-primary) 40%, transparent);
      background: linear-gradient(160deg, var(--g-panel), var(--g-surface));
    }
    .info {
      position: relative; z-index: 1; min-width: 0; flex: 1;
      display: flex; flex-direction: column; gap: 6px; padding-right: 4px;
    }
    .progress-label {
      font-size: 0.9rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: color-mix(in srgb, var(--g-primary) 90%, white);
    }
    .progress-label .ops { margin-left: 8px; opacity: 0.7; color: var(--g-muted); font-weight: 500; }
    .title {
      font-size: 1.55rem; font-weight: 700; line-height: 1.2; color: var(--g-fg);
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .compact .title { font-size: 1.1rem; }
    .title.comic { font-style: italic; }
    .title.pixel { text-transform: uppercase; letter-spacing: -0.02em; }
    .note { font-size: 1.02rem; font-weight: 500; color: var(--g-accent); }
    .bar {
      margin-top: 10px; height: 6px; width: 100%; overflow: hidden;
      background: color-mix(in srgb, var(--g-fg) 10%, transparent);
    }
    .bar-fill {
      height: 100%; transition: width .7s ease;
      background: linear-gradient(90deg, var(--g-primary), var(--g-primary-dim));
      box-shadow: 0 0 12px color-mix(in srgb, var(--g-glow) 55%, transparent);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--g-glow) 35%, transparent); }
      50% { box-shadow: 0 0 32px color-mix(in srgb, var(--g-glow) 60%, transparent); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-overlay, .letter-box, .cover { animation: none !important; }
    }
  </style>
</head>

 "shape": "sharp", "flair": "pixel", "primary": "#3dff7a", "primaryDim": "#128a3a", "accent": "#b8ffd0"}}], "L": [{"id": "lol", "title": "League of Legends", "note": "", "cover": "covers/lol.jpg", "theme": {"surface": "#0a0c14", "panel": "#12162a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#d4af37", "shape": "soft", "flair": "fantasy", "primary": "#c89b3c", "primaryDim": "#78581c", "accent": "#0ac8b9"}}], "M": [{"id": "minecraft", "title": "Minecraft Bedwars", "note": "", "cover": "covers/minecraft.jpg", "theme": {"surface": "#0c140a", "panel": "#142010", "fg": "#e8f5e0", "muted": "#9ab88a", "glow": "#7dce52", "shape": "sharp", "flair": "pixel", "primary": "#5d9c3e", "primaryDim": "#2e5a1c", "accent": "#c6a15b"}}], "N": [{"id": "naraka", "title": "Naraka: Bladepoint", "note": "", "cover": "covers/naraka.jpg", "theme": {"surface": "#120a08", "panel": "#1c100c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff6b4a", "shape": "soft", "flair": "fantasy", "primary": "#e85d4c", "primaryDim": "#8a2818", "accent": "#f0c878"}}], "O": [{"id": "overwatch2", "title": "Overwatch 2", "note": "", "cover": "covers/overwatch2.jpg", "theme": {"surface": "#0e1018", "panel": "#161a28", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffb84d", "shape": "pill", "flair": "neon", "primary": "#f99e1a", "primaryDim": "#a85a08", "accent": "#ffffff"}}], "P": [{"id": "pubg", "title": "PUBG: Battlegrounds", "note": "", "cover": "covers/pubg.jpg", "theme": {"surface": "#101208", "panel": "#181a10", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffc107", "shape": "sharp", "flair": "military", "primary": "#f2a900", "primaryDim": "#8a5e00", "accent": "#e8e0c8"}}], "Q": [{"id": "quake", "title": "Quake Champions", "note": "", "cover": "covers/quake.jpg", "theme": {"surface": "#100808", "panel": "#1a0c0c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff5722", "shape": "sharp", "flair": "energy", "primary": "#ff4500", "primaryDim": "#8a2000", "accent": "#ffcc00"}}], "R": [{"id": "rocket", "title": "Rocket League", "note": "", "cover": "covers/rocket.jpg", "theme": {"surface": "#080e16", "panel": "#0e1824", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#00c2ff", "shape": "soft", "flair": "neon", "primary": "#00a8e8", "primaryDim": "#005f8a", "accent": "#ff6b35"}}], "S": [{"id": "splitgate", "title": "Splitgate", "note": "", "cover": "covers/splitgate.jpg", "theme": {"surface": "#0a0a16", "panel": "#12122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#8b7cff", "shape": "soft", "flair": "energy", "primary": "#7b61ff", "primaryDim": "#3d2a9a", "accent": "#00e5ff"}}], "T": [{"id": "siege", "title": "Tom Clancy's Rainbow Six Siege", "note": "", "cover": "covers/siege.jpg", "theme": {"surface": "#0c0c0c", "panel": "#161616", "fg": "#f2f6ff", "muted": "#a0a0a0", "glow": "#ffd54f", "shape": "sharp", "flair": "military", "primary": "#ffd200", "primaryDim": "#8a7000", "accent": "#ffffff"}}], "U": [{"id": "uno", "title": "UNO", "note": "", "cover": "covers/uno.jpg", "theme": {"surface": "#140808", "panel": "#1c0c0c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff3b3b", "shape": "pill", "flair": "comic", "primary": "#ed1c24", "primaryDim": "#8a0e12", "accent": "#ffde00"}}], "V": [{"id": "valorant", "title": "Valorant", "note": "", "cover": "covers/valorant.jpg", "theme": {"surface": "#0f1923", "panel": "#1a2733", "fg": "#ece8e1", "muted": "#8b978f", "glow": "#ff4655", "shape": "sharp", "flair": "neon", "primary": "#ff4655", "primaryDim": "#8a1a22", "accent": "#ece8e1"}}], "W": [{"id": "warships", "title": "World of Warships", "note": "", "cover": "covers/warships.jpg", "theme": {"surface": "#060c14", "panel": "#0c1624", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#4da3ff", "shape": "soft", "flair": "naval", "primary": "#3d8bfd", "primaryDim": "#1a4a8a", "accent": "#a8d4ff"}}], "X": [{"id": "xeno", "title": "Dragon Ball: Xenoverse 2", "note": "", "cover": "covers/xeno.jpg", "theme": {"surface": "#140c04", "panel": "#1c1408", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffb300", "shape": "soft", "flair": "energy", "primary": "#ff9800", "primaryDim": "#b35a00", "accent": "#ffeb3b"}}], "Y": [{"id": "yugioh", "title": "Yu-Gi-Oh! Master Duel", "note": "", "cover": "covers/yugioh.jpg", "theme": {"surface": "#0c0a12", "panel": "#16122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#e0c060", "shape": "soft", "flair": "fantasy", "primary": "#d4af37", "primaryDim": "#7a5c10", "accent": "#5b8def"}}], "Z": [{"id": "z1", "title": "Z1 Battle Royale", "note": "", "cover": "covers/z1.jpg", "theme": {"surface": "#0c100a", "panel": "#141a10", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#aed581", "shape": "sharp", "flair": "military", "primary": "#9ccc65", "primaryDim": "#4a6e28", "accent": "#cfd8dc"}}]};
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const shapeRadius = { sharp: "8px", soft: "18px", pill: "28px" };
    const letterRadius = { sharp: "6px", soft: "16px", pill: "999px" };

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, String.fromCharCode(38) + "amp;")
        .replace(/</g, String.fromCharCode(38) + "lt;")
        .replace(/>/g, String.fromCharCode(38) + "gt;")
        .replace(/"/g, String.fromCharCode(38) + "quot;")
        .replace(/'/g, String.fromCharCode(38) + "#39;");
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      let letter = (p.get("letter") || "B").toUpperCase();
      if (!DATA[letter]) letter = "B";
      let pick = parseInt(p.get("pick") || "0", 10);
      if (Number.isNaN(pick) || pick < 0) pick = 0;
      const opts = DATA[letter];
      if (pick >= opts.length) pick = 0;
      // also allow game=id
      const gameId = p.get("game");
      if (gameId) {
        const idx = opts.findIndex((o) => o.id === gameId);
        if (idx >= 0) pick = idx;
      }
      const mode = p.get("mode") === "overlay" ? "overlay" : "control";
      return { letter, pick, mode };
    }

    function progressOf(letter) {
      const num = LETTERS.indexOf(letter) + 1;
      return { num, pct: (num / 26) * 100 };
    }

    function flairHTML(flair) {
      if (flair === "military") {
        return '<div class="flair-layer" style="opacity:.07;background-image:repeating-linear-gradient(-45deg,var(--g-primary) 0 1px,transparent 1px 8px)"></div><div class="flair-layer" style="width:6px;right:auto;background:var(--g-primary);opacity:1"></div>';
      }
      if (flair === "neon") {
        return '<div class="flair-layer" style="opacity:.4;background:radial-gradient(ellipse at 20% 50%, color-mix(in srgb, var(--g-primary) 25%, transparent), transparent 55%)"></div>';
      }
      if (flair === "energy") {
        return '<div class="flair-layer" style="opacity:.3;background:radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--g-accent) 35%, transparent), transparent 40%), radial-gradient(circle at 10% 80%, color-mix(in srgb, var(--g-primary) 30%, transparent), transparent 45%)"></div>';
      }
      if (flair === "pixel") {
        return '<div class="flair-layer" style="opacity:.12;background-image:linear-gradient(var(--g-primary) 1px, transparent 1px), linear-gradient(90deg, var(--g-primary) 1px, transparent 1px);background-size:12px 12px"></div>';
      }
      if (flair === "fantasy") {
        return '<div class="flair-layer" style="opacity:.25;background:linear-gradient(135deg, color-mix(in srgb, var(--g-primary) 20%, transparent), transparent 40%, color-mix(in srgb, var(--g-accent) 15%, transparent))"></div>';
      }
      if (flair === "comic") {
        return '<div class="flair-layer" style="opacity:.14;background-image:radial-gradient(var(--g-primary) 1px, transparent 1px);background-size:10px 10px"></div>';
      }
      if (flair === "naval") {
        return '<div class="flair-layer" style="opacity:.2;background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--g-primary) 18%, transparent))"></div>';
      }
      return "";
    }

    function overlayHTML(letter, game, compact) {
      const th = game.theme;
      const { num, pct } = progressOf(letter);
      const coverR = th.shape === "pill" ? "14px" : th.shape === "sharp" ? "4px" : "10px";
      const barR = th.shape === "sharp" ? "2px" : "999px";
      const titleClass = th.flair === "comic" ? "title comic" : th.flair === "pixel" ? "title pixel" : "title";
      const coverSrc = game.cover;
      const coverInner = coverSrc
        ? '<img src="' + escapeHtml(coverSrc) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'" /><div class="ph" style="display:none">' + letter + "</div>"
        : '<div class="ph">' + letter + "</div>";
      return (
        '<div class="game-overlay ' + (compact ? "compact" : "") + '" data-flair="' + th.flair + '" style="' +
        "--g-primary:" + th.primary +
        ";--g-primary-dim:" + th.primaryDim +
        ";--g-accent:" + th.accent +
        ";--g-surface:" + th.surface +
        ";--g-panel:" + th.panel +
        ";--g-fg:" + th.fg +
        ";--g-muted:" + th.muted +
        ";--g-glow:" + th.glow +
        ";--g-radius:" + shapeRadius[th.shape] +
        ";--g-letter-radius:" + letterRadius[th.shape] +
        '">' +
        flairHTML(th.flair) +
        '<div class="letter-box"><span>' + letter + "</span></div>" +
        '<div class="cover" style="border-radius:' + coverR + '">' + coverInner + "</div>" +
        '<div class="info">' +
        '<div class="progress-label">' + num + " / 26" +
        (th.flair === "military" ? '<span class="ops">// OPS</span>' : "") +
        "</div>" +
        '<div class="' + titleClass + '">' + escapeHtml(game.title) + "</div>" +
        (game.note ? '<div class="note">' + escapeHtml(game.note) + "</div>" : "") +
        '<div class="bar" style="border-radius:' + barR + '"><div class="bar-fill" style="width:' + pct + '%;border-radius:inherit"></div></div>' +
        "</div></div>"
      );
    }

    function setParams(letter, pick, mode) {
      const u = new URL(location.href);
      u.searchParams.set("letter", letter);
      if (pick > 0) u.searchParams.set("pick", String(pick));
      else u.searchParams.delete("pick");
      const opts = DATA[letter];
      if (opts && opts[pick]) u.searchParams.set("game", opts[pick].id);
      if (mode === "overlay") u.searchParams.set("mode", "overlay");
      else u.searchParams.delete("mode");
      history.replaceState(null, "", u);
      render();
    }

    function render() {
      const { letter, pick, mode } = getParams();
      const opts = DATA[letter];
      const game = opts[pick];
      const app = document.getElementById("app");

      if (mode === "overlay") {
        document.body.className = "overlay-mode";
        document.documentElement.style.background = "transparent";
        app.innerHTML = overlayHTML(letter, game, false);
        return;
      }

      document.body.className = "";
      document.documentElement.style.background = "";
      const idx = LETTERS.indexOf(letter);
      const obs = new URL(location.href);
      obs.searchParams.set("letter", letter);
      if (pick > 0) obs.searchParams.set("pick", String(pick));
      else obs.searchParams.delete("pick");
      obs.searchParams.set("game", game.id);
      obs.searchParams.set("mode", "overlay");
      const obsStr = obs.toString();

      let picksHtml = "";
      if (opts.length > 1) {
        picksHtml =
          '<div class="picks">' +
          opts
            .map(function (o, i) {
              const active = i === pick ? " active" : "";
              const label = o.note ? o.title + " — " + o.note : o.title;
              return (
                '<button type="button" class="pick-btn' +
                active +
                '" data-pick="' +
                i +
                '" style="--pick:' +
                o.theme.primary +
                '">' +
                escapeHtml(label) +
                "</button>"
              );
            })
            .join("") +
          "</div>";
      }

      app.innerHTML =
        '<div class="control">' +
        "<header>" +
        '<div class="badge">A–Z Marathon</div>' +
        "<h1>Streamer control</h1>" +
        '<p class="lead">Pick a letter. If a letter has multiple game options (like E: Expedition 33 vs EA Sports), choose which one. Copy the OBS URL for the themed overlay with cover art.</p>' +
        "</header>" +
        '<div class="grid">' +
        '<section class="card">' +
        '<div class="row"><div><h2>Live preview</h2>' +
        '<div class="hint" style="margin:0">Theme: <span style="color:' +
        game.theme.primary +
        '">' +
        game.theme.flair +
        "</span></div></div>" +
        '<div class="nav-btns">' +
        '<button class="icon-btn" id="prev" ' +
        (idx <= 0 ? "disabled" : "") +
        ' aria-label="Previous">‹</button>' +
        '<button class="icon-btn" id="next" ' +
        (idx >= 25 ? "disabled" : "") +
        ' aria-label="Next">›</button>' +
        "</div></div>" +
        picksHtml +
        '<div class="preview-wrap" style="background:radial-gradient(ellipse at center, color-mix(in srgb, ' +
        game.theme.primary +
        ' 14%, transparent), transparent 70%)">' +
        overlayHTML(letter, game, true) +
        "</div>" +
        '<div class="url-row">' +
        '<div class="url-box"><code id="urlText">' +
        escapeHtml(obsStr) +
        "</code></div>" +
        '<button class="copy-btn" id="copy" style="background:' +
        game.theme.primary +
        '">Copy OBS URL</button>' +
        "</div>" +
        '<p class="hint">OBS → Browser Source → paste URL → ~900×280 → transparent background. URL includes <code>letter</code> + <code>game</code>/<code>pick</code>.</p>' +
        "</section>" +
        '<section class="card"><h2 style="margin-bottom:14px">All letters</h2><div class="letters" id="letters"></div></section>' +
        "</div>" +
        '<section class="card how"><h2 style="margin-bottom:10px">Multi-game letters</h2>' +
        "<ol>" +
        "<li><strong>D</strong> — Destiny 2 with challenge options: Trials Flawless or Rumble.</li>" +
        "<li><strong>E</strong> — Clair Obscur: Expedition 33 (Beat Simon), or EA Sports FC.</li>" +
        "<li>Other letters are single-game. Covers are bundled so art loads in OBS.</li>" +
        "</ol></section>" +
        "</div>";

      const lettersEl = document.getElementById("letters");
      LETTERS.forEach(function (L) {
        const options = DATA[L];
        const g0 = options[0];
        const active = L === letter;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "letter-btn";
        b.style.borderColor = active ? g0.theme.primary : "var(--border)";
        b.style.background = active
          ? "color-mix(in srgb, " + g0.theme.primary + " 18%, #0a0e18)"
          : "var(--bg)";
        b.style.boxShadow = active
          ? "0 0 14px color-mix(in srgb, " + g0.theme.glow + " 35%, transparent)"
          : "";
        const title =
          options.length > 1
            ? options.map(function (o) { return o.title; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(" / ")
            : g0.title;
        b.innerHTML =
          '<strong style="color:' +
          (active ? g0.theme.primary : g0.theme.fg) +
          '">' +
          L +
          "</strong><span>" +
          escapeHtml(title) +
          "</span>" +
          (options.length > 1
            ? '<span class="multi">' + options.length + " options</span>"
            : "");
        b.onclick = function () {
          setParams(L, 0, "control");
        };
        lettersEl.appendChild(b);
      });

      document.querySelectorAll(".pick-btn").forEach(function (btn) {
        btn.onclick = function () {
          setParams(letter, parseInt(btn.getAttribute("data-pick"), 10), "control");
        };
      });

      document.getElementById("prev").onclick = function () {
        if (idx <= 0) return;
        setParams(LETTERS[idx - 1], 0, "control");
      };
      document.getElementById("next").onclick = function () {
        if (idx >= 25) return;
        setParams(LETTERS[idx + 1], 0, "control");
      };
      document.getElementById("copy").onclick = async function () {
        try {
          await navigator.clipboard.writeText(obsStr);
          const btn = document.getElementById("copy");
          btn.textContent = "Copied";
          setTimeout(function () {
            btn.textContent = "Copy OBS URL";
          }, 1400);
        } catch (e) {
          prompt("Copy this OBS URL:", obsStr);
        }
      };
    }

    render();
  </script>
</body>
</html>
