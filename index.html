<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>A–Z Marathon Overlay</title>
  <style>

    :root {
      --bg: #070a12;
      --surface: #0e1422;
      --fg: #e8f0ff;
      --muted: #7a8aa8;
      --border: #1e2a42;
      --primary: #00c6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    body.overlay-mode {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    button { cursor: pointer; font: inherit; border: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input, textarea {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    input:focus, textarea:focus {
      outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent);
      border-color: color-mix(in srgb, var(--primary) 50%, var(--border));
    }

    .control {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin-top: 8px; max-width: 40rem; line-height: 1.5; font-size: 0.95rem; }
    .grid { display: grid; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.15fr 0.85fr; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row h2 { font-size: 1.05rem; }
    .nav-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
      display: grid; place-items: center;
      font-size: 20px;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      min-height: 190px;
      align-items: center;
      overflow: hidden;
    }
    .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .pick-btn {
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
    }
    .pick-btn.active {
      border-color: var(--pick, var(--primary));
      box-shadow: 0 0 14px color-mix(in srgb, var(--pick, var(--primary)) 40%, transparent);
      background: color-mix(in srgb, var(--pick, var(--primary)) 16%, #0a0e18);
    }
    .url-row { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 640px) { .url-row { flex-direction: row; align-items: stretch; } }
    .url-box {
      flex: 1; min-width: 0;
      display: flex; align-items: stretch;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
    }
    .url-box textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: none;
      background: transparent;
      color: #dce8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.4;
      padding: 12px 14px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .url-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .url-actions .copy-btn { height: auto; min-height: 48px; flex: 1; }
    .url-actions .secondary-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
    }
    .copy-btn {
      height: 48px; padding: 0 18px;
      border-radius: 12px;
      font-weight: 700; font-size: 14px;
      color: #071018;
      white-space: nowrap;
    }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .letters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 480px) { .letters { grid-template-columns: repeat(5, 1fr); } }
    .letter-btn {
      min-height: 56px;
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 8px 10px;
      color: var(--fg);
    }
    .letter-btn strong { display: block; font-size: 18px; font-weight: 800; line-height: 1; }
    .letter-btn span {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.2;
    }
    .letter-btn .multi {
      display: inline-block;
      margin-top: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .how ol {
      margin-left: 1.15rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .how code {
      background: var(--bg);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    /* Timer / challenge form */
    .timer-card, .challenge-card {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .timer-card .clock {
      font-size: 1.85rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      min-width: 10.5rem;
    }
    .timer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .timer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .timer-actions button, .challenge-card button {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
    }
    .timer-actions button.primary, .challenge-card button.primary {
      border: none;
      color: #071018;
    }
    .elapsed-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;
      margin-top: 10px;
    }
    .elapsed-row label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .elapsed-row input {
      width: 72px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .challenge-card label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .challenge-card input[type="text"] {
      width: 100%;
      margin-bottom: 8px;
    }
    .field-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }

    /* ===== Flashy overlay ===== */
    .game-overlay {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      width: min(820px, 100%);
      max-width: 820px;
      padding: 18px 22px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 45%, transparent);
      border-radius: var(--g-radius, 18px);
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--g-surface) 88%, transparent),
          color-mix(in srgb, var(--g-panel) 92%, transparent));
      color: var(--g-fg);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--g-primary) 18%, transparent),
        0 0 50px color-mix(in srgb, var(--g-glow) 28%, transparent),
        0 18px 40px rgba(0,0,0,.45),
        inset 0 0 40px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      animation: fadeUp .55s ease-out both;
    }
    .game-overlay.compact { gap: 14px; padding: 14px 16px; max-width: 720px; animation: fadeUp .45s ease-out both; }

    .game-overlay::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from var(--spin, 0deg),
        transparent 0 40%,
        color-mix(in srgb, var(--g-primary) 35%, transparent) 48%,
        transparent 55% 100%);
      animation: none; /* aura via JS */
      opacity: 0.35;
      z-index: 0;
    }
    .game-overlay::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: color-mix(in srgb, var(--g-surface) 94%, transparent);
      z-index: 0;
    }
    .game-overlay > * { position: relative; z-index: 1; }

    .scanlines {
      position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 2px,
        rgba(0,0,0,.12) 2px 3px
      );
      opacity: 0.35;
      mix-blend-mode: multiply;
    }
    .shine {
      position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; overflow: hidden;
    }
    .shine::before {
      content: "";
      position: absolute;
      top: -20%; left: -40%;
      width: 40%; height: 140%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-20deg);
      animation: shineSweep 4.5s ease-in-out infinite;
    }
    .spark {
      position: absolute; z-index: 2; pointer-events: none;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--g-primary);
      box-shadow: 0 0 10px var(--g-glow), 0 0 18px var(--g-primary);
      animation: sparkFloat 3.5s ease-in-out infinite;
      opacity: 0.85;
    }
    .spark.s2 { width: 4px; height: 4px; animation-duration: 4.2s; animation-delay: .6s; }
    .spark.s3 { width: 5px; height: 5px; animation-duration: 3.1s; animation-delay: 1.2s; }

    .game-overlay[data-flair="military"] .corner {
      position: absolute; width: 18px; height: 18px; z-index: 3; pointer-events: none;
      border-color: var(--g-primary);
    }
    .corner.tl { top: 7px; left: 7px; border-top: 2px solid; border-left: 2px solid; }
    .corner.br { right: 7px; bottom: 7px; border-right: 2px solid; border-bottom: 2px solid; }

    .flair-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; border-radius: inherit; }

    .letter-box {
      flex-shrink: 0;
      display: grid; place-items: center;
      width: 88px; height: 88px;
      border: 2px solid color-mix(in srgb, var(--g-primary) 60%, transparent);
      border-radius: var(--g-letter-radius, 16px);
      background:
        radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--g-primary) 28%, transparent), transparent 55%),
        linear-gradient(145deg, var(--g-panel), color-mix(in srgb, var(--g-surface) 80%, black));
      box-shadow:
        0 0 28px color-mix(in srgb, var(--g-glow) 50%, transparent),
        inset 0 0 20px color-mix(in srgb, var(--g-primary) 12%, transparent);
      /* pulse via JS for OBS */
    }
    .compact .letter-box { width: 72px; height: 72px; }
    .letter-box span {
      font-weight: 900;
      font-size: 3.4rem;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #fff, var(--g-primary) 55%, var(--g-primary-dim));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--g-glow) 60%, transparent));
      /* letter via JS for OBS */
    }
    .compact .letter-box span { font-size: 2.7rem; }

    .cover {
      flex-shrink: 0;
      width: 100px; height: 134px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 35%, transparent);
      box-shadow:
        0 10px 28px rgba(0,0,0,.55),
        0 0 22px color-mix(in srgb, var(--g-glow) 25%, transparent);
      background: var(--g-panel);
      /* float via JS for OBS */
    }
    .compact .cover { width: 86px; height: 116px; }
    .cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .6s ease;
      /* zoom via JS for OBS */
    }
    .cover .ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 2.5rem; font-weight: 800;
      color: color-mix(in srgb, var(--g-primary) 40%, transparent);
      background: linear-gradient(160deg, var(--g-panel), var(--g-surface));
    }

    .info {
      min-width: 0; flex: 1;
      display: flex; flex-direction: column; gap: 6px; padding-right: 4px;
    }
    .progress-label {
      font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: color-mix(in srgb, var(--g-primary) 92%, white);
      text-shadow: 0 0 12px color-mix(in srgb, var(--g-glow) 40%, transparent);
    }
        .title {
      font-size: clamp(1.2rem, 2.4vw, 1.55rem);
      font-weight: 800;
      line-height: 1.2;
      color: var(--g-fg);
      text-shadow: 0 2px 10px rgba(0,0,0,.45), 0 0 20px color-mix(in srgb, var(--g-glow) 18%, transparent);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 100%;
    }
    .compact .title { font-size: clamp(1.1rem, 2.2vw, 1.35rem); }
    .title.comic { font-style: italic; }
    .title.pixel { text-transform: uppercase; letter-spacing: -0.02em; }
    .note {
      font-size: 0.85rem; font-weight: 600; color: var(--g-accent);
      text-shadow: 0 0 10px color-mix(in srgb, var(--g-accent) 35%, transparent);
    }
    .custom-challenge {
      font-size: 0.95rem;
      font-weight: 600;
      color: color-mix(in srgb, var(--g-fg) 90%, var(--g-primary));
      opacity: 0.95;
    }
    .custom-challenge .tag {
      display: inline-block;
      margin-right: 6px;
      font-size: 0.72em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--g-primary);
      opacity: 0.85;
    }

    

    .main-col {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
    }
    .main-col .title {
      width: 100%;
      flex: 0 0 auto;
    }
    .main-bottom {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      margin-top: 2px;
    }
    .main-meta {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: flex-end;
    }
    .timer-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-width: 9.5rem;
      max-width: 42%;
      margin-left: 0;
      padding: 0 0 0 10px;
      border-left: 1px solid color-mix(in srgb, var(--g-primary) 28%, transparent);
      text-align: right;
      align-self: flex-end;
    }
    .compact .timer-panel {
      min-width: 6.5rem;
      padding-left: 8px;
    }
    .timer-panel .label {
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.62rem;
      opacity: 0.8;
      color: color-mix(in srgb, var(--g-primary) 90%, white);
      margin-bottom: 2px;
    }
    .compact .timer-panel .label { font-size: 0.58rem; }
    .timer-panel .run-clock {
      font-size: clamp(1.7rem, 3.2vw, 2.35rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: color-mix(in srgb, var(--g-primary) 92%, white);
      text-shadow:
        0 0 18px color-mix(in srgb, var(--g-glow) 60%, transparent),
        0 2px 8px rgba(0,0,0,.5);
      white-space: nowrap;
    }
    .compact .timer-panel .run-clock { font-size: clamp(1.4rem, 2.8vw, 1.85rem); }
    .timer-panel .run-clock.days {
      font-size: clamp(1.35rem, 2.8vw, 1.85rem);
    }
    .compact .timer-panel .run-clock.days { font-size: clamp(1.2rem, 2.5vw, 1.55rem); }


        .compact .timer-panel {
      min-width: 130px;
      padding: 6px 8px 6px 12px;
    }
    .timer-panel .label {
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
      opacity: 0.8;
      color: color-mix(in srgb, var(--g-primary) 90%, white);
      margin-bottom: 4px;
    }
    .compact .timer-panel .label { font-size: 0.62rem; }
    .timer-panel .run-clock {
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: color-mix(in srgb, var(--g-primary) 92%, white);
      text-shadow:
        0 0 22px color-mix(in srgb, var(--g-glow) 60%, transparent),
        0 2px 10px rgba(0,0,0,.5);
      white-space: nowrap;
    }
    .compact .timer-panel .run-clock { font-size: 1.55rem; }
    .timer-panel .run-clock.days {
      font-size: 1.95rem;
    }
    .compact .timer-panel .run-clock.days { font-size: 1.25rem; }
    /* legacy class if any */
    .total-time { display: none; }

    .bar {
      margin-top: 6px; height: 5px; width: 100%; overflow: hidden;
      background: color-mix(in srgb, var(--g-fg) 10%, transparent);
      box-shadow: inset 0 0 8px rgba(0,0,0,.35);
    }
    .bar-fill {
      height: 100%;
      position: relative;
      background: linear-gradient(90deg, var(--g-primary-dim), var(--g-primary), color-mix(in srgb, var(--g-primary) 50%, white));
      box-shadow: 0 0 16px color-mix(in srgb, var(--g-glow) 65%, transparent);
      /* bar via JS for OBS */
    }
    .bar-fill::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      animation: barShine 1.8s linear infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--g-glow) 40%, transparent); }
      50% { box-shadow: 0 0 36px color-mix(in srgb, var(--g-glow) 70%, transparent); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--g-primary) 18%, transparent), 0 0 45px color-mix(in srgb, var(--g-glow) 24%, transparent), 0 18px 40px rgba(0,0,0,.45); }
      50% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--g-primary) 40%, transparent), 0 0 70px color-mix(in srgb, var(--g-glow) 40%, transparent), 0 18px 40px rgba(0,0,0,.45); }
    }
    @keyframes spinAura {
      to { --spin: 360deg; transform: rotate(360deg); }
    }
    @property --spin {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes shineSweep {
      0%, 55% { left: -40%; opacity: 0; }
      60% { opacity: 1; }
      85% { left: 120%; opacity: 0.7; }
      100% { left: 120%; opacity: 0; }
    }
    @keyframes sparkFloat {
      0%, 100% { transform: translate(0,0) scale(1); opacity: .3; }
      50% { transform: translate(8px,-14px) scale(1.3); opacity: 1; }
    }
    @keyframes letterPop {
      0%, 100% { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--g-glow) 50%, transparent)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--g-glow) 80%, transparent)); transform: scale(1.04); }
    }
    @keyframes coverZoom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes barGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
    @keyframes barShine {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    
    
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 2px solid var(--g-primary);

function prefersReducedMotion() {

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, String.fromCharCode(38) + "amp;")
        .replace(/</g, String.fromCharCode(38) + "lt;")
        .replace(/>/g, String.fromCharCode(38) + "gt;")
        .replace(/"/g, String.fromCharCode(38) + "quot;")
        .replace(/'/g, String.fromCharCode(38) + "#39;");
    }

    function formatDuration(ms) {
      if (ms < 0) ms = 0;
      const totalSec = Math.floor(ms / 1000);
      // Total hours (can go past 24: 25:00:00, 72:15:30) — easier to read than days
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return h + ":" + pad(m) + ":" + pad(s);
    }

    function readStoredRunStart() {
      try {
        const v = localStorage.getItem(RUN_KEY);
        if (!v) return null;
        const n = parseInt(v, 10);
        return Number.isFinite(n) && n > 0 ? n : null;
      } catch (e) { return null; }
    }

    function writeStoredRunStart(ts) {
      try {
        if (ts) localStorage.setItem(RUN_KEY, String(ts));
        else localStorage.removeItem(RUN_KEY);
      } catch (e) {}
    }

    
    function readStoredGameStart() {
      try {
        var v = localStorage.getItem(GAME_KEY);
        if (!v) return null;
        var n = parseInt(v, 10);
        return Number.isFinite(n) && n > 0 ? n : null;
      } catch (e) { return null; }
    }
    function writeStoredGameStart(ts) {
      try {
        if (ts) localStorage.setItem(GAME_KEY, String(ts));
        else localStorage.removeItem(GAME_KEY);
      } catch (e) {}
    }

    function readStoredChallenge() {
      try { return localStorage.getItem(CHAL_KEY) || ""; } catch (e) { return ""; }
    }
    function writeStoredChallenge(text) {
      try {
        if (text) localStorage.setItem(CHAL_KEY, text);
        else localStorage.removeItem(CHAL_KEY);
      } catch (e) {}
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      let letter = (p.get("letter") || "B").toUpperCase();
      if (!DATA[letter]) letter = "B";
      let pick = parseInt(p.get("pick") || "0", 10);
      if (Number.isNaN(pick) || pick < 0) pick = 0;
      const opts = DATA[letter];
      if (pick >= opts.length) pick = 0;
      const gameId = p.get("game");
      if (gameId) {
        const idx = opts.findIndex((o) => o.id === gameId);
        if (idx >= 0) pick = idx;
      }
      const mode = p.get("mode") === "overlay" ? "overlay" : "control";

      let runStart = null;
      const runParam = p.get("runStart") || p.get("start");
      if (runParam) {
        const n = parseInt(runParam, 10);
        if (Number.isFinite(n) && n > 1000000000) {
          runStart = n > 1e12 ? Math.floor(n / 1000) : n;
        }
      }
      if (!runStart) runStart = readStoredRunStart();

      // optional custom challenge: challenge / goal / custom
      let challenge = p.get("challenge") || p.get("goal") || p.get("custom") || "";
      if (!challenge) challenge = readStoredChallenge();
      challenge = String(challenge).trim().slice(0, 120);

      let gameStart = null;
      const gameParam = p.get("gameStart") || p.get("gameTimer");
      if (gameParam) {
        const gn = parseInt(gameParam, 10);
        if (Number.isFinite(gn) && gn > 1000000000) {
          gameStart = gn > 1e12 ? Math.floor(gn / 1000) : gn;
        }
      }
      if (!gameStart) gameStart = readStoredGameStart();

      return { letter, pick, mode, runStart, challenge, gameStart };
    }

    function applyRunStartToUrl(u, runStart) {
      if (runStart) u.searchParams.set("runStart", String(runStart));
      else u.searchParams.delete("runStart");
      u.searchParams.delete("start");
    }

    function applyGameStartToUrl(u, gameStart) {
      if (gameStart) u.searchParams.set("gameStart", String(gameStart));
      else u.searchParams.delete("gameStart");
      u.searchParams.delete("gameTimer");
    }

    function applyChallengeToUrl(u, challenge) {
      u.searchParams.delete("goal");
      u.searchParams.delete("custom");
      if (challenge && challenge.trim()) u.searchParams.set("challenge", challenge.trim());
      else u.searchParams.delete("challenge");
    }

    function progressOf(letter) {
      const num = LETTERS.indexOf(letter) + 1;
      return { num, pct: (num / 26) * 100 };
    }

    function flairHTML(flair) {
      if (flair === "military") {
        return '<div class="flair-layer" style="opacity:.1;background-image:repeating-linear-gradient(-45deg,var(--g-primary) 0 1px,transparent 1px 9px)"></div>' +

      }
      if (flair === "energy") {
        return '<div class="flair-layer" style="opacity:.4;background:radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--g-accent) 40%, transparent), transparent 40%), radial-gradient(circle at 10% 85%, color-mix(in srgb, var(--g-primary) 35%, transparent), transparent 45%)"></div>';
      }
      if (flair === "pixel") {
        return '<div class="flair-layer" style="opacity:.16;background-image:linear-gradient(var(--g-primary) 1px, transparent 1px), linear-gradient(90deg, var(--g-primary) 1px, transparent 1px);background-size:12px 12px"></div>';
      }
      if (flair === "fantasy") {
        return '<div class="flair-layer" style="opacity:.32;background:linear-gradient(135deg, color-mix(in srgb, var(--g-primary) 25%, transparent), transparent 40%, color-mix(in srgb, var(--g-accent) 18%, transparent))"></div>';
      }
      if (flair === "comic") {
        return '<div class="flair-layer" style="opacity:.18;background-image:radial-gradient(var(--g-primary) 1.2px, transparent 1.2px);background-size:10px 10px"></div>';

      if (flair === "naval") {
        return '<div class="flair-layer" style="opacity:.28;background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--g-primary) 22%, transparent))"></div>';

    function overlayHTML(letter, game, compact, runStart, challenge, gameStart) {

      const gameElapsed = gameStart ? formatDuration(gameElapsedMs) : "";
      const gameCryLevel = !gameStart ? 0
        : gameElapsedMs >= 5 * 60 * 60 * 1000 ? 2
        : gameElapsedMs > 2 * 60 * 60 * 1000 ? 1
        : 0;
      const timerPanel =

      return (

        ";--g-accent:" + th.accent +

    function startTicking() {
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(function () {
        document.querySelectorAll(".run-clock, .control-run-clock, .control-game-clock").forEach(function (el) {
          var start = parseInt(el.getAttribute("data-run-start") || el.getAttribute("data-game-start"), 10);
          if (!start) {
            if (el.classList.contains("control-run-clock") || el.classList.contains("control-game-clock") || el.classList.contains("run-clock")) {
              if (!el.getAttribute("data-run-start") && !el.getAttribute("data-game-start")) {
                if (el.textContent === "" || el.textContent.indexOf("-") >= 0) el.textContent = "--:--:--";
              }
            }
            return;
          }
          var text = formatDuration(Date.now() - start * 1000);
          el.textContent = text;
          if (el.classList.contains("run-clock")) {
            if (text.indexOf("d ") >= 0) el.classList.add("days");
            else el.classList.remove("days");
          }
        });

        document.querySelectorAll(".game-clock[data-game-start]").forEach(function (el) {
          var start = parseInt(el.getAttribute("data-game-start"), 10);
          if (!start) return;
          var ms = Date.now() - start * 1000;
          var block = el.closest(".timer-block.game-time") || el.parentElement;
          if (!block) return;
          var level = ms >= 5 * 60 * 60 * 1000 ? 2 : ms > 2 * 60 * 60 * 1000 ? 1 : 0;
          if (level) block.classList.add("is-long");
          else block.classList.remove("is-long");
          if (level >= 2) block.classList.add("is-very-long");
          else block.classList.remove("is-very-long");
          var flag = block.querySelector(".long-game-flag");
          if (level && !flag) {
            flag = document.createElement("div");
            flag.className = "long-game-flag";
            block.appendChild(flag);
          }
          if (level && flag) {
            flag.title = level >= 2 ? "5+ hours on this game" : "Over 2 hours on this game";
            flag.innerHTML =
              '<span class="long-arrow">➜</span><span class="long-emoji">😭</span>' +
              (level >= 2 ? '<span class="long-emoji">😭</span>' : "");
          } else if (!level && flag) {
            flag.remove();
          }
        });

      }, 250);
      startObsAnimations();
    }

    function setParams(letter, pick, mode, runStart, challenge, gameStart) {
      const cur = getParams();
      if (runStart === undefined) runStart = cur.runStart;
      if (challenge === undefined) challenge = cur.challenge;
      if (gameStart === undefined) gameStart = cur.gameStart;
      const u = new URL(location.href);
      u.searchParams.set("letter", letter);
      if (pick > 0) u.searchParams.set("pick", String(pick));
      else u.searchParams.delete("pick");
      const opts = DATA[letter];
      if (opts && opts[pick]) u.searchParams.set("game", opts[pick].id);
      if (mode === "overlay") u.searchParams.set("mode", "overlay");
      else u.searchParams.delete("mode");
      applyRunStartToUrl(u, runStart);
      applyGameStartToUrl(u, gameStart);
      applyChallengeToUrl(u, challenge);
      history.replaceState(null, "", u);
      render();
    }

    function runStartFromElapsed(d, h, m, s) {
      const total =
        (Math.max(0, d|0) * 86400) +
        (Math.max(0, h|0) * 3600) +
        (Math.max(0, m|0) * 60) +
        Math.max(0, s|0);
      return Math.floor(Date.now() / 1000) - total;
    }

      const opts = DATA[letter];

      const app = document.getElementById("app");

      if (mode === "overlay") {
        document.body.className = "overlay-mode";
        document.documentElement.style.background = "transparent";
        app.innerHTML = overlayHTML(letter, game, false, runStart, challenge, gameStart);
        startTicking();
        startObsAnimations();
        return;
      }

      document.body.className = "";
      document.documentElement.style.background = "";
      const idx = LETTERS.indexOf(letter);
      // Clean full overlay URL (no leftover junk params)
      const obs = new URL(location.origin + location.pathname);
      obs.searchParams.set("letter", letter);
      obs.searchParams.set("game", game.id);
      if (pick > 0) obs.searchParams.set("pick", String(pick));
      obs.searchParams.set("mode", "overlay");
      applyRunStartToUrl(obs, runStart);
      applyGameStartToUrl(obs, gameStart);
      applyChallengeToUrl(obs, challenge);
      const obsStr = obs.toString();

      let picksHtml = "";
      if (opts.length > 1) {
        picksHtml =
          '<div class="picks">' +
          opts.map(function (o, i) {
            const active = i === pick ? " active" : "";
            const label = o.note ? o.title + " — " + o.note : o.title;
            return (
              '<button type="button" class="pick-btn' + active + '" data-pick="' + i +
              '" style="--pick:' + o.theme.primary + '">' + escapeHtml(label) + "</button>"
            );
          }).join("") +
          "</div>";
      }

      const gameClockVal = gameStart ? formatDuration(Date.now() - gameStart * 1000) : "00:00:00";
      const clockVal = runStart ? formatDuration(Date.now() - runStart * 1000) : "00:00:00";
      let gd = 0, gh = 0, gm = 0, gs = 0;
      if (gameStart) {
        const gSec = Math.max(0, Math.floor(Date.now() / 1000 - gameStart));
        gd = 0;
        gh = Math.floor(gSec / 3600); // total hours
        gm = Math.floor((gSec % 3600) / 60);
        gs = gSec % 60;
      }
      let ed = 0, eh = 0, em = 0, es = 0;
      if (runStart) {
        const totalSec = Math.max(0, Math.floor(Date.now() / 1000 - runStart));
        ed = 0;
        eh = Math.floor(totalSec / 3600); // total hours (can be 25, 72, …)
        em = Math.floor((totalSec % 3600) / 60);
        es = totalSec % 60;
      }

      const timerHtml =
        '<div class="timer-card">' +
        '<div class="timer-head">' +
        '<div><div class="field-hint" style="margin-bottom:4px">Current game</div>' +
        '<div class="clock control-game-clock" data-game-start="' + (gameStart || "") + '">' + gameClockVal + "</div></div>" +
        '<div class="timer-actions" style="margin-left:auto">' +
        '<button type="button" class="primary" id="startGame" style="background:' + game.theme.primary + '">' +
        (gameStart ? "Restart game timer" : "Start game timer") + "</button>" +
        (gameStart ? '<button type="button" id="clearGame">Clear game</button>' : "") +
        "</div></div>" +
        '<div class="elapsed-row">' +
        '<label>Days<input id="gd" type="number" min="0" max="365" value="' + gd + '" /></label>' +
        '<label>Hours<input id="gh" type="number" min="0" max="999" value="' + gh + '" /></label>' +
        '<label>Mins<input id="gm" type="number" min="0" max="59" value="' + gm + '" /></label>' +
        '<label>Secs<input id="gs" type="number" min="0" max="59" value="' + gs + '" /></label>' +
        '<button type="button" class="primary" id="applyGameElapsed" style="background:' + game.theme.primary + ';height:42px">Set game time in</button>' +
        "</div>" +
        '<p class="field-hint" style="margin-top:8px">Resets when you change letter (auto). Or set time already spent on this game.</p>' +
        '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0" />' +
        '<div class="timer-head">' +
        '<div><div class="field-hint" style="margin-bottom:4px">Whole-run total</div>' +
        '<div class="clock control-run-clock" data-run-start="' + (runStart || "") + '">' + clockVal + "</div></div>" +
        '<div class="timer-actions" style="margin-left:auto">' +
        '<button type="button" class="primary" id="startRun" style="background:' + game.theme.primary + '">' +
        (runStart ? "Restart total from 0" : "Start total now") + "</button>" +
        (runStart ? '<button type="button" id="clearRun">Clear total</button>' : "") +
        "</div></div>" +
        '<div class="elapsed-row">' +
        '<label>Days<input id="ed" type="number" min="0" max="365" value="' + ed + '" /></label>' +
        '<label>Hours<input id="eh" type="number" min="0" max="999" value="' + eh + '" /></label>' +
        '<label>Mins<input id="em" type="number" min="0" max="59" value="' + em + '" /></label>' +
        '<label>Secs<input id="es" type="number" min="0" max="59" value="' + es + '" /></label>' +
        '<button type="button" class="primary" id="applyElapsed" style="background:' + game.theme.primary + ';height:42px">Set total time in</button>' +
        "</div>" +
        '<p class="field-hint" style="margin-top:8px">Full marathon time across all letters. Shows as total hours (e.g. 25:30:00, 72:00:00).</p>' +
        "</div>";


      const challengeHtml =
        '<div class="challenge-card">' +
        '<label for="challengeInput">Custom challenge (optional)</label>' +
        '<input id="challengeInput" type="text" maxlength="120" placeholder="e.g. Win 3 ranked matches without dying" value="' +
        escapeHtml(challenge) + '" />' +
        '<div class="timer-actions">' +
        '<button type="button" class="primary" id="applyChallenge" style="background:' + game.theme.primary + '">Apply challenge</button>' +
        '<button type="button" id="clearChallenge">Clear</button>' +
        "</div>" +
        '<p class="field-hint" style="margin-top:8px">Optional. Shows under the game title on the overlay. Leave blank if this letter has no special challenge.</p>' +
        "</div>";

      app.innerHTML =
        '<div class="control">' +
        "<header>" +
        '<div class="badge">A–Z Marathon</div>' +
        "<h1>Streamer control</h1>" +
        '<p class="lead">Pick a letter, set total run time (even if you already started hours ago), optionally add a challenge line, then copy the OBS URL. Each streamer’s timer is only in their own OBS link.</p>' +
        "</header>" +
        '<div class="grid">' +
        '<section class="card">' +
        '<div class="row"><div><h2>Live preview</h2>' +
        '<div class="hint" style="margin:0">Theme: <span style="color:' + game.theme.primary + '">' + game.theme.flair + "</span></div></div>" +
        '<div class="nav-btns">' +
        '<button class="icon-btn" id="prev" ' + (idx <= 0 ? "disabled" : "") + ' aria-label="Previous">‹</button>' +
        '<button class="icon-btn" id="next" ' + (idx >= 25 ? "disabled" : "") + ' aria-label="Next">›</button>' +
        "</div></div>" +
        '<div class="motion-note" id="motionNote"><strong>Motion check:</strong> Watch the live preview below. If the letter/cover/glow is moving, you\'re good — stay on this page and <strong>Copy full OBS URL</strong> for stream. If it\'s frozen, hard-refresh or open <a href="https://franklinelliott.github.io/creeationally/?v=motion">the motion link</a>, then copy the OBS URL from there.</div>' +
        timerHtml +
        challengeHtml +
        picksHtml +
        '<div class="preview-wrap" style="background:radial-gradient(ellipse at center, color-mix(in srgb, ' + game.theme.primary + ' 18%, transparent), transparent 70%)">' +
        overlayHTML(letter, game, true, runStart, challenge, gameStart) +
        "</div>" +
                '<div class="url-row">' +
        '<div class="url-box"><textarea id="urlText" readonly rows="3">' + escapeHtml(obsStr) + "</textarea></div>" +
        '<div class="url-actions">' +
        '<button class="copy-btn" id="copy" style="background:' + game.theme.primary + '">Copy full OBS URL</button>' +
        '<button type="button" class="secondary-btn" id="selectUrl">Select all</button>' +
        "</div></div>" +
        '<p class="hint">OBS → Browser Source → paste the <strong>full</strong> URL → width <strong>860</strong>, height <strong>188</strong> (exact — overlay is fixed size) → transparent background. Use the Copy button (don’t try to highlight the truncated text).</p>' +
        "</section>" +
        '<section class="card"><h2 style="margin-bottom:14px">All letters</h2><div class="letters" id="letters"></div></section>' +
        "</div>" +
        '<section class="card how"><h2 style="margin-bottom:10px">Quick tips</h2><ol>' +
        "<li><strong>Set time already in</strong> with total hours if the marathon is long (e.g. 25, 72).</li>" +
        "<li><strong>Custom challenge</strong> is optional — only shows if you fill it in.</li>" +
        "<li>Timer lives in the OBS URL (<code>runStart</code>). Other streamers do not affect yours.</li>" +
        "<li><strong>E</strong> has Expedition 33 or EA Sports FC. Use custom challenge for goals.</li>" +
        "</ol></section></div>";

      const lettersEl = document.getElementById("letters");
      LETTERS.forEach(function (L) {
        const options = DATA[L];
        const g0 = options[0];
        const active = L === letter;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "letter-btn";
        b.style.borderColor = active ? g0.theme.primary : "var(--border)";
        b.style.background = active ? "color-mix(in srgb, " + g0.theme.primary + " 18%, #0a0e18)" : "var(--bg)";
        b.style.boxShadow = active ? "0 0 14px color-mix(in srgb, " + g0.theme.glow + " 35%, transparent)" : "";
        const title = options.length > 1
          ? options.map(function (o) { return o.title; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(" / ")
          : g0.title;
        b.innerHTML =
          '<strong style="color:' + (active ? g0.theme.primary : g0.theme.fg) + '">' + L +
          "</strong><span>" + escapeHtml(title) + "</span>" +
          (options.length > 1 ? '<span class="multi">' + options.length + " options</span>" : "");
        b.onclick = function () { (function(){ var gs = Math.floor(Date.now()/1000); writeStoredGameStart(gs); setParams(L, 0, "control", runStart, challenge, gs); })(); };
        lettersEl.appendChild(b);
      });

      document.querySelectorAll(".pick-btn").forEach(function (btn) {
        btn.onclick = function () {
          (function(){ var gs = Math.floor(Date.now()/1000); writeStoredGameStart(gs); setParams(letter, parseInt(btn.getAttribute("data-pick"), 10), "control", runStart, challenge, gs); })();
        };
      });

      document.getElementById("prev").onclick = function () {
        if (idx <= 0) return;
        (function(){ var gs = Math.floor(Date.now()/1000); writeStoredGameStart(gs); setParams(LETTERS[idx - 1], 0, "control", runStart, challenge, gs); })();
      };
      document.getElementById("next").onclick = function () {
        if (idx >= 25) return;
        (function(){ var gs = Math.floor(Date.now()/1000); writeStoredGameStart(gs); setParams(LETTERS[idx + 1], 0, "control", runStart, challenge, gs); })();
      };
      function fullObsUrl() {
        const ta = document.getElementById("urlText");
        return (ta && ta.value) ? ta.value : obsStr;
      }

      async function copyFullUrl() {
        const text = fullObsUrl();
        const btn = document.getElementById("copy");
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            throw new Error("no clipboard api");
          }
          btn.textContent = "Copied full URL";
          setTimeout(function () { btn.textContent = "Copy full OBS URL"; }, 1600);
        } catch (e) {
          // Fallback: select textarea so user can copy whole thing
          const ta = document.getElementById("urlText");
          if (ta) {
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, ta.value.length);
            try {
              const ok = document.execCommand("copy");
              if (ok) {
                btn.textContent = "Copied full URL";
                setTimeout(function () { btn.textContent = "Copy full OBS URL"; }, 1600);
                return;
              }
            } catch (e2) {}
          }
          window.prompt("Copy the FULL URL below (select all):", text);
        }
      }

      document.getElementById("copy").onclick = function () { copyFullUrl(); };
      document.getElementById("selectUrl").onclick = function () {
        const ta = document.getElementById("urlText");
        if (!ta) return;
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
      };

      
      var startGameBtn = document.getElementById("startGame");
      if (startGameBtn) {
        startGameBtn.onclick = function () {
          var now = Math.floor(Date.now() / 1000);
          writeStoredGameStart(now);
          setParams(letter, pick, "control", runStart, challenge, now);
        };
      }
      var clearGameBtn = document.getElementById("clearGame");
      if (clearGameBtn) {
        clearGameBtn.onclick = function () {
          writeStoredGameStart(null);
          setParams(letter, pick, "control", runStart, challenge, null);
        };
      }
      var applyGameElapsedBtn = document.getElementById("applyGameElapsed");
      if (applyGameElapsedBtn) {
        applyGameElapsedBtn.onclick = function () {
          var d = parseInt(document.getElementById("gd").value, 10) || 0;
          var h = parseInt(document.getElementById("gh").value, 10) || 0;
          var m = parseInt(document.getElementById("gm").value, 10) || 0;
          var s = parseInt(document.getElementById("gs").value, 10) || 0;
          var gs = runStartFromElapsed(d, h, m, s);
          writeStoredGameStart(gs);
          setParams(letter, pick, "control", runStart, challenge, gs);
        };
      }

      document.getElementById("startRun").onclick = function () {
        const now = Math.floor(Date.now() / 1000);
        writeStoredRunStart(now);
        setParams(letter, pick, "control", now, challenge, gameStart);
      };
      const clearRun = document.getElementById("clearRun");
      if (clearRun) {
        clearRun.onclick = function () {
          writeStoredRunStart(null);
          setParams(letter, pick, "control", null, challenge, gameStart);
        };
      }
      document.getElementById("applyElapsed").onclick = function () {
        const d = parseInt(document.getElementById("ed").value, 10) || 0;
        const h = parseInt(document.getElementById("eh").value, 10) || 0;
        const m = parseInt(document.getElementById("em").value, 10) || 0;
        const s = parseInt(document.getElementById("es").value, 10) || 0;
        const rs = runStartFromElapsed(d, h, m, s);
        writeStoredRunStart(rs);
        setParams(letter, pick, "control", rs, challenge, gameStart);
      };
      document.getElementById("applyChallenge").onclick = function () {
        const text = (document.getElementById("challengeInput").value || "").trim().slice(0, 120);
        writeStoredChallenge(text);
        setParams(letter, pick, "control", runStart, text, gameStart);
      };
      document.getElementById("clearChallenge").onclick = function () {
        writeStoredChallenge("");
        document.getElementById("challengeInput").value = "";
        setParams(letter, pick, "control", runStart, "", gameStart);
      };

      startTicking();
        startObsAnimations();
    }

    render();

    render();
    setInterval(function () {
      if (document.querySelector(".game-overlay") && !animTimer) startObsAnimations();
    }, 2000);

    render();

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  </script>
</body>
</html>
