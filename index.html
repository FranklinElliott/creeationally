<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A–Z Marathon Overlay</title>
  <style>
    :root {
      --bg: #070a12;
      --surface: #0e1422;
      --fg: #e8f0ff;
      --muted: #7a8aa8;
      --border: #1e2a42;
      --primary: #00c6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    body.overlay-mode {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    button { cursor: pointer; font: inherit; border: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input, textarea {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    input:focus, textarea:focus {
      outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent);
      border-color: color-mix(in srgb, var(--primary) 50%, var(--border));
    }

    .control {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin-top: 8px; max-width: 40rem; line-height: 1.5; font-size: 0.95rem; }
    .grid { display: grid; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.15fr 0.85fr; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row h2 { font-size: 1.05rem; }
    .nav-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
      display: grid; place-items: center;
      font-size: 20px;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      min-height: 190px;
      align-items: center;
      overflow: hidden;
    }
    .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .pick-btn {
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
    }
    .pick-btn.active {
      border-color: var(--pick, var(--primary));
      box-shadow: 0 0 14px color-mix(in srgb, var(--pick, var(--primary)) 40%, transparent);
      background: color-mix(in srgb, var(--pick, var(--primary)) 16%, #0a0e18);
    }
    .url-row { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 640px) { .url-row { flex-direction: row; } }
    .url-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .url-box code {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #dce8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy-btn {
      height: 48px; padding: 0 18px;
      border-radius: 12px;
      font-weight: 700; font-size: 14px;
      color: #071018;
      white-space: nowrap;
    }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .letters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 480px) { .letters { grid-template-columns: repeat(5, 1fr); } }
    .letter-btn {
      min-height: 56px;
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 8px 10px;
      color: var(--fg);
    }
    .letter-btn strong { display: block; font-size: 18px; font-weight: 800; line-height: 1; }
    .letter-btn span {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.2;
    }
    .letter-btn .multi {
      display: inline-block;
      margin-top: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .how ol {
      margin-left: 1.15rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .how code {
      background: var(--bg);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    /* Timer / challenge form */
    .timer-card, .challenge-card {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .timer-card .clock {
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    .timer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .timer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .timer-actions button, .challenge-card button {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
    }
    .timer-actions button.primary, .challenge-card button.primary {
      border: none;
      color: #071018;
    }
    .elapsed-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;
      margin-top: 10px;
    }
    .elapsed-row label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .elapsed-row input {
      width: 72px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .challenge-card label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .challenge-card input[type="text"] {
      width: 100%;
      margin-bottom: 8px;
    }
    .field-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }

    /* ===== Flashy overlay ===== */
    .game-overlay {
      position: relative;
      display: flex;
      align-items: center;
      gap: 28px;
      width: min(940px, 100%);
      padding: 24px 34px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 45%, transparent);
      border-radius: var(--g-radius, 18px);
      background:
        linear-gradient(135deg,
          color-mix(in srgb, var(--g-surface) 88%, transparent),
          color-mix(in srgb, var(--g-panel) 92%, transparent));
      color: var(--g-fg);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--g-primary) 18%, transparent),
        0 0 50px color-mix(in srgb, var(--g-glow) 28%, transparent),
        0 18px 40px rgba(0,0,0,.45),
        inset 0 0 40px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      animation: fadeUp .55s ease-out both, borderPulse 3.2s ease-in-out infinite;
    }
    .game-overlay.compact { gap: 16px; padding: 14px 18px; max-width: 740px; animation: fadeUp .45s ease-out both; }

    .game-overlay::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from var(--spin, 0deg),
        transparent 0 40%,
        color-mix(in srgb, var(--g-primary) 35%, transparent) 48%,
        transparent 55% 100%);
      animation: spinAura 8s linear infinite;
      opacity: 0.35;
      z-index: 0;
    }
    .game-overlay::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: color-mix(in srgb, var(--g-surface) 94%, transparent);
      z-index: 0;
    }
    .game-overlay > * { position: relative; z-index: 1; }

    .scanlines {
      position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 2px,
        rgba(0,0,0,.12) 2px 3px
      );
      opacity: 0.35;
      mix-blend-mode: multiply;
    }
    .shine {
      position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; overflow: hidden;
    }
    .shine::before {
      content: "";
      position: absolute;
      top: -20%; left: -40%;
      width: 40%; height: 140%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-20deg);
      animation: shineSweep 4.5s ease-in-out infinite;
    }
    .spark {
      position: absolute; z-index: 2; pointer-events: none;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--g-primary);
      box-shadow: 0 0 10px var(--g-glow), 0 0 18px var(--g-primary);
      animation: sparkFloat 3.5s ease-in-out infinite;
      opacity: 0.85;
    }
    .spark.s2 { width: 4px; height: 4px; animation-duration: 4.2s; animation-delay: .6s; }
    .spark.s3 { width: 5px; height: 5px; animation-duration: 3.1s; animation-delay: 1.2s; }

    .game-overlay[data-flair="military"] .corner {
      position: absolute; width: 18px; height: 18px; z-index: 3; pointer-events: none;
      border-color: var(--g-primary);
    }
    .corner.tl { top: 7px; left: 7px; border-top: 2px solid; border-left: 2px solid; }
    .corner.br { right: 7px; bottom: 7px; border-right: 2px solid; border-bottom: 2px solid; }

    .flair-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; border-radius: inherit; }

    .letter-box {
      flex-shrink: 0;
      display: grid; place-items: center;
      width: 112px; height: 112px;
      border: 2px solid color-mix(in srgb, var(--g-primary) 60%, transparent);
      border-radius: var(--g-letter-radius, 16px);
      background:
        radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--g-primary) 28%, transparent), transparent 55%),
        linear-gradient(145deg, var(--g-panel), color-mix(in srgb, var(--g-surface) 80%, black));
      box-shadow:
        0 0 28px color-mix(in srgb, var(--g-glow) 50%, transparent),
        inset 0 0 20px color-mix(in srgb, var(--g-primary) 12%, transparent);
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .compact .letter-box { width: 76px; height: 76px; }
    .letter-box span {
      font-weight: 900;
      font-size: 4.7rem;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #fff, var(--g-primary) 55%, var(--g-primary-dim));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--g-glow) 60%, transparent));
      animation: letterPop 2.4s ease-in-out infinite;
    }
    .compact .letter-box span { font-size: 3rem; }

    .cover {
      flex-shrink: 0;
      width: 132px; height: 176px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 35%, transparent);
      box-shadow:
        0 10px 28px rgba(0,0,0,.55),
        0 0 22px color-mix(in srgb, var(--g-glow) 25%, transparent);
      background: var(--g-panel);
      animation: floatY 3.6s ease-in-out infinite;
    }
    .compact .cover { width: 88px; height: 118px; }
    .cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .6s ease;
      animation: coverZoom 8s ease-in-out infinite;
    }
    .cover .ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 2.5rem; font-weight: 800;
      color: color-mix(in srgb, var(--g-primary) 40%, transparent);
      background: linear-gradient(160deg, var(--g-panel), var(--g-surface));
    }

    .info {
      min-width: 0; flex: 1;
      display: flex; flex-direction: column; gap: 6px; padding-right: 4px;
    }
    .progress-label {
      font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: color-mix(in srgb, var(--g-primary) 92%, white);
      text-shadow: 0 0 12px color-mix(in srgb, var(--g-glow) 40%, transparent);
    }
    .progress-label .ops { margin-left: 8px; opacity: 0.7; color: var(--g-muted); font-weight: 500; }
    .title {
      font-size: 1.6rem; font-weight: 800; line-height: 1.15; color: var(--g-fg);
      text-shadow: 0 2px 10px rgba(0,0,0,.45), 0 0 20px color-mix(in srgb, var(--g-glow) 18%, transparent);
    }
    .compact .title { font-size: 1.12rem; }
    .title.comic { font-style: italic; }
    .title.pixel { text-transform: uppercase; letter-spacing: -0.02em; }
    .note {
      font-size: 1.02rem; font-weight: 600; color: var(--g-accent);
      text-shadow: 0 0 10px color-mix(in srgb, var(--g-accent) 35%, transparent);
    }
    .custom-challenge {
      font-size: 0.95rem;
      font-weight: 600;
      color: color-mix(in srgb, var(--g-fg) 90%, var(--g-primary));
      opacity: 0.95;
    }
    .custom-challenge .tag {
      display: inline-block;
      margin-right: 6px;
      font-size: 0.72em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--g-primary);
      opacity: 0.85;
    }
    .total-time {
      margin-top: 4px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: color-mix(in srgb, var(--g-primary) 90%, white);
      text-shadow: 0 0 14px color-mix(in srgb, var(--g-glow) 45%, transparent);
    }
    .compact .total-time { font-size: 0.88rem; }
    .total-time .label {
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-right: 8px;
      font-size: 0.75em;
    }
    .bar {
      margin-top: 10px; height: 7px; width: 100%; overflow: hidden;
      background: color-mix(in srgb, var(--g-fg) 10%, transparent);
      box-shadow: inset 0 0 8px rgba(0,0,0,.35);
    }
    .bar-fill {
      height: 100%;
      position: relative;
      background: linear-gradient(90deg, var(--g-primary-dim), var(--g-primary), color-mix(in srgb, var(--g-primary) 50%, white));
      box-shadow: 0 0 16px color-mix(in srgb, var(--g-glow) 65%, transparent);
      animation: barGlow 2s ease-in-out infinite;
    }
    .bar-fill::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      animation: barShine 1.8s linear infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--g-glow) 40%, transparent); }
      50% { box-shadow: 0 0 36px color-mix(in srgb, var(--g-glow) 70%, transparent); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes borderPulse {
      0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--g-primary) 18%, transparent), 0 0 45px color-mix(in srgb, var(--g-glow) 24%, transparent), 0 18px 40px rgba(0,0,0,.45); }
      50% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--g-primary) 40%, transparent), 0 0 70px color-mix(in srgb, var(--g-glow) 40%, transparent), 0 18px 40px rgba(0,0,0,.45); }
    }
    @keyframes spinAura {
      to { --spin: 360deg; transform: rotate(360deg); }
    }
    @property --spin {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes shineSweep {
      0%, 55% { left: -40%; opacity: 0; }
      60% { opacity: 1; }
      85% { left: 120%; opacity: 0.7; }
      100% { left: 120%; opacity: 0; }
    }
    @keyframes sparkFloat {
      0%, 100% { transform: translate(0,0) scale(1); opacity: .3; }
      50% { transform: translate(8px,-14px) scale(1.3); opacity: 1; }
    }
    @keyframes letterPop {
      0%, 100% { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--g-glow) 50%, transparent)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--g-glow) 80%, transparent)); transform: scale(1.04); }
    }
    @keyframes coverZoom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes barGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
    @keyframes barShine {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-overlay, .letter-box, .cover, .shine::before, .spark, .bar-fill, .bar-fill::after, .letter-box span, .cover img {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const DATA = {"A": [{"id": "apex", "title": "Apex Legends", "note": "", "cover": "covers/apex.jpg", "theme": {"surface": "#140a0a", "panel": "#1c0e0e", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff3b3b", "shape": "sharp", "flair": "military", "primary": "#da292a", "primaryDim": "#8b1012", "accent": "#f0a500"}}], "B": [{"id": "bo2", "title": "Call of Duty: Black Ops II", "note": "Hit a Trickshot", "cover": "covers/bo2.jpg", "theme": {"surface": "#0a120a", "panel": "#0f1a0f", "fg": "#e8ffe8", "muted": "#8fb88f", "glow": "#39ff14", "shape": "sharp", "flair": "military", "primary": "#6bff4d", "primaryDim": "#1f7a28", "accent": "#c8ff9a"}}], "C": [{"id": "cs2", "title": "Counter-Strike 2", "note": "", "cover": "covers/cs2.jpg", "theme": {"surface": "#12100c", "panel": "#1a1610", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#e8a838", "shape": "sharp", "flair": "military", "primary": "#de9b35", "primaryDim": "#8a5a12", "accent": "#f5d08a"}}], "D": [{"id": "destiny2-trials", "title": "Destiny 2", "note": "Trials Flawless", "cover": "covers/destiny2.jpg", "theme": {"surface": "#0c0b14", "panel": "#15122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#f0d060", "shape": "soft", "flair": "energy", "primary": "#c9a227", "primaryDim": "#6e4f0a", "accent": "#7ec8ff"}}, {"id": "destiny2-rumble", "title": "Destiny 2", "note": "Rumble \u2014 3 wins in a row", "cover": "covers/destiny2.jpg", "theme": {"surface": "#0c0b14", "panel": "#15122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#f0d060", "shape": "soft", "flair": "energy", "primary": "#c9a227", "primaryDim": "#6e4f0a", "accent": "#ff9f43"}}], "E": [{"id": "expedition33", "title": "Clair Obscur: Expedition 33", "note": "Beat Simon", "cover": "covers/expedition33.jpg", "theme": {"surface": "#0e0a14", "panel": "#1a1228", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#c4a8ff", "shape": "soft", "flair": "fantasy", "primary": "#b794f6", "primaryDim": "#5c3d8a", "accent": "#e8d5a3"}}, {"id": "ea-fc", "title": "EA Sports  "shape": "sharp", "flair": "pixel", "primary": "#3dff7a", "primaryDim": "#128a3a", "accent": "#b8ffd0"}}], "L": [{"id": "lol", "title": "League of Legends", "note": "", "cover": "covers/lol.jpg", "theme": {"surface": "#0a0c14", "panel": "#12162a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#d4af37", "shape": "soft", "flair": "fantasy", "primary": "#c89b3c", "primaryDim": "#78581c", "accent": "#0ac8b9"}}], "M": [{"id": "minecraft", "title": "Minecraft Bedwars", "note": "", "cover": "covers/minecraft.jpg", "theme": {"surface": "#0c140a", "panel": "#142010", "fg": "#e8f5e0", "muted": "#9ab88a", "glow": "#7dce52", "shape": "sharp", "flair": "pixel", "primary": "#5d9c3e", "primaryDim": "#2e5a1c", "accent": "#c6a15b"}}], "N": [{"id": "naraka", "title": "Naraka: Bladepoint", "note": "", "cover": "covers/naraka.jpg", "theme": {"surface": "#120a08", "panel": "#1c100c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff6b4a", "shape": "soft", "flair": "fantasy", "primary": "#e85d4c", "primaryDim": "#8a2818", "accent": "#f0c878"}}], "O": [{"id": "overwatch2", "title": "Overwatch 2", "note": "", "cover": "covers/overwatch2.jpg", "theme": {"surface": "#0e1018", "panel": "#161a28", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffb84d", "shape": "pill", "flair": "neon", "primary": "#f99e1a", "primaryDim": "#a85a08", "accent": "#ffffff"}}], "P": [{"id": "pubg", "title": "PUBG: Battlegrounds", "note": "", "cover": "covers/pubg.jpg", "theme": {"surface": "#101208", "panel": "#181a10", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffc107", "shape": "sharp", "flair": "military", "primary": "#f2a900", "primaryDim": "#8a5e00", "accent": "#e8e0c8"}}], "Q": [{"id": "quake", "title": "Quake Champions", "note": "", "cover": "covers/quake.jpg", "theme": {"surface": "#100808", "panel": "#1a0c0c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff5722", "shape": "sharp", "flair": "energy", "primary": "#ff4500", "primaryDim": "#8a2000", "accent": "#ffcc00"}}], "R": [{"id": "rocket", "title": "Rocket League", "note": "", "cover": "covers/rocket.jpg", "theme": {"surface": "#080e16", "panel": "#0e1824", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#00c2ff", "shape": "soft", "flair": "neon", "primary": "#00a8e8", "primaryDim": "#005f8a", "accent": "#ff6b35"}}], "S": [{"id": "splitgate", "title": "Splitgate", "note": "", "cover": "covers/splitgate.jpg", "theme": {"surface": "#0a0a16", "panel": "#12122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#8b7cff", "shape": "soft", "flair": "energy", "primary": "#7b61ff", "primaryDim": "#3d2a9a", "accent": "#00e5ff"}}], "T": [{"id": "siege", "title": "Tom Clancy's Rainbow Six Siege", "note": "", "cover": "covers/siege.jpg", "theme": {"surface": "#0c0c0c", "panel": "#161616", "fg": "#f2f6ff", "muted": "#a0a0a0", "glow": "#ffd54f", "shape": "sharp", "flair": "military", "primary": "#ffd200", "primaryDim": "#8a7000", "accent": "#ffffff"}}], "U": [{"id": "uno", "title": "UNO", "note": "", "cover": "covers/uno.jpg", "theme": {"surface": "#140808", "panel": "#1c0c0c", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ff3b3b", "shape": "pill", "flair": "comic", "primary": "#ed1c24", "primaryDim": "#8a0e12", "accent": "#ffde00"}}], "V": [{"id": "valorant", "title": "Valorant", "note": "", "cover": "covers/valorant.jpg", "theme": {"surface": "#0f1923", "panel": "#1a2733", "fg": "#ece8e1", "muted": "#8b978f", "glow": "#ff4655", "shape": "sharp", "flair": "neon", "primary": "#ff4655", "primaryDim": "#8a1a22", "accent": "#ece8e1"}}], "W": [{"id": "warships", "title": "World of Warships", "note": "", "cover": "covers/warships.jpg", "theme": {"surface": "#060c14", "panel": "#0c1624", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#4da3ff", "shape": "soft", "flair": "naval", "primary": "#3d8bfd", "primaryDim": "#1a4a8a", "accent": "#a8d4ff"}}], "X": [{"id": "xeno", "title": "Dragon Ball: Xenoverse 2", "note": "", "cover": "covers/xeno.jpg", "theme": {"surface": "#140c04", "panel": "#1c1408", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#ffb300", "shape": "soft", "flair": "energy", "primary": "#ff9800", "primaryDim": "#b35a00", "accent": "#ffeb3b"}}], "Y": [{"id": "yugioh", "title": "Yu-Gi-Oh! Master Duel", "note": "", "cover": "covers/yugioh.jpg", "theme": {"surface": "#0c0a12", "panel": "#16122a", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#e0c060", "shape": "soft", "flair": "fantasy", "primary": "#d4af37", "primaryDim": "#7a5c10", "accent": "#5b8def"}}], "Z": [{"id": "z1", "title": "Z1 Battle Royale", "note": "", "cover": "covers/z1.jpg", "theme": {"surface": "#0c100a", "panel": "#141a10", "fg": "#f2f6ff", "muted": "#9aabc4", "glow": "#aed581", "shape": "sharp", "flair": "military", "primary": "#9ccc65", "primaryDim": "#4a6e28", "accent": "#cfd8dc"}}]};
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const shapeRadius = { sharp: "8px", soft: "18px", pill: "28px" };
    const letterRadius = { sharp: "6px", soft: "16px", pill: "999px" };
    const RUN_KEY = "az_marathon_run_start";
    const CHAL_KEY = "az_marathon_challenge";
    let tickTimer = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, String.fromCharCode(38) + "amp;")
        .replace(/</g, String.fromCharCode(38) + "lt;")
        .replace(/>/g, String.fromCharCode(38) + "gt;")
        .replace(/"/g, String.fromCharCode(38) + "quot;")
        .replace(/'/g, String.fromCharCode(38) + "#39;");
    }

    function formatDuration(ms) {
      if (ms < 0) ms = 0;
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return pad(h) + ":" + pad(m) + ":" + pad(s);
    }

    function readStoredRunStart() {
      try {
        const v = localStorage.getItem(RUN_KEY);
        if (!v) return null;
        const n = parseInt(v, 10);
        return Number.isFinite(n) && n > 0 ? n : null;
      } catch (e) { return null; }
    }

    function writeStoredRunStart(ts) {
      try {
        if (ts) localStorage.setItem(RUN_KEY, String(ts));
        else localStorage.removeItem(RUN_KEY);
      } catch (e) {}
    }

    function readStoredChallenge() {
      try { return localStorage.getItem(CHAL_KEY) || ""; } catch (e) { return ""; }
    }
    function writeStoredChallenge(text) {
      try {
        if (text) localStorage.setItem(CHAL_KEY, text);
        else localStorage.removeItem(CHAL_KEY);
      } catch (e) {}
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      let letter = (p.get("letter") || "B").toUpperCase();
      if (!DATA[letter]) letter = "B";
      let pick = parseInt(p.get("pick") || "0", 10);
      if (Number.isNaN(pick) || pick < 0) pick = 0;
      const opts = DATA[letter];
      if (pick >= opts.length) pick = 0;
      const gameId = p.get("game");
      if (gameId) {
        const idx = opts.findIndex((o) => o.id === gameId);
        if (idx >= 0) pick = idx;
      }
      const mode = p.get("mode") === "overlay" ? "overlay" : "control";

      let runStart = null;
      const runParam = p.get("runStart") || p.get("start");
      if (runParam) {
        const n = parseInt(runParam, 10);
        if (Number.isFinite(n) && n > 1000000000) {
          runStart = n > 1e12 ? Math.floor(n / 1000) : n;
        }
      }
      if (!runStart) runStart = readStoredRunStart();

      // optional custom challenge: challenge / goal / custom
      let challenge = p.get("challenge") || p.get("goal") || p.get("custom") || "";
      if (!challenge) challenge = readStoredChallenge();
      challenge = String(challenge).trim().slice(0, 120);

      return { letter, pick, mode, runStart, challenge };
    }

    function applyRunStartToUrl(u, runStart) {
      if (runStart) u.searchParams.set("runStart", String(runStart));
      else u.searchParams.delete("runStart");
      u.searchParams.delete("start");
    }

    function applyChallengeToUrl(u, challenge) {
      u.searchParams.delete("goal");
      u.searchParams.delete("custom");
      if (challenge && challenge.trim()) u.searchParams.set("challenge", challenge.trim());
      else u.searchParams.delete("challenge");
    }

    function progressOf(letter) {
      const num = LETTERS.indexOf(letter) + 1;
      return { num, pct: (num / 26) * 100 };
    }

    function flairHTML(flair) {
      if (flair === "military") {
        return '<div class="flair-layer" style="opacity:.1;background-image:repeating-linear-gradient(-45deg,var(--g-primary) 0 1px,transparent 1px 9px)"></div>' +
          '<div class="corner tl"></div><div class="corner br"></div>';
      }
      if (flair === "neon") {
        return '<div class="flair-layer" style="opacity:.55;background:radial-gradient(ellipse at 15% 40%, color-mix(in srgb, var(--g-primary) 35%, transparent), transparent 50%), radial-gradient(ellipse at 90% 70%, color-mix(in srgb, var(--g-accent) 22%, transparent), transparent 45%)"></div>';
      }
      if (flair === "energy") {
        return '<div class="flair-layer" style="opacity:.4;background:radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--g-accent) 40%, transparent), transparent 40%), radial-gradient(circle at 10% 85%, color-mix(in srgb, var(--g-primary) 35%, transparent), transparent 45%)"></div>';
      }
      if (flair === "pixel") {
        return '<div class="flair-layer" style="opacity:.16;background-image:linear-gradient(var(--g-primary) 1px, transparent 1px), linear-gradient(90deg, var(--g-primary) 1px, transparent 1px);background-size:12px 12px"></div>';
      }
      if (flair === "fantasy") {
        return '<div class="flair-layer" style="opacity:.32;background:linear-gradient(135deg, color-mix(in srgb, var(--g-primary) 25%, transparent), transparent 40%, color-mix(in srgb, var(--g-accent) 18%, transparent))"></div>';
      }
      if (flair === "comic") {
        return '<div class="flair-layer" style="opacity:.18;background-image:radial-gradient(var(--g-primary) 1.2px, transparent 1.2px);background-size:10px 10px"></div>';
      }
      if (flair === "naval") {
        return '<div class="flair-layer" style="opacity:.28;background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--g-primary) 22%, transparent))"></div>';
      }
      return "";
    }

    function overlayHTML(letter, game, compact, runStart, challenge) {
      const th = game.theme;
      const { num, pct } = progressOf(letter);
      const coverR = th.shape === "pill" ? "14px" : th.shape === "sharp" ? "4px" : "10px";
      const barR = th.shape === "sharp" ? "2px" : "999px";
      const titleClass = th.flair === "comic" ? "title comic" : th.flair === "pixel" ? "title pixel" : "title";
      const coverSrc = game.cover;
      const coverInner = coverSrc
        ? '<img src="' + escapeHtml(coverSrc) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'" /><div class="ph" style="display:none">' + letter + "</div>"
        : '<div class="ph">' + letter + "</div>";
      const elapsed = runStart ? formatDuration(Date.now() - runStart * 1000) : "";
      const timerBlock = runStart
        ? '<div class="total-time"><span class="label">Total</span><span class="run-clock" data-run-start="' + runStart + '">' + elapsed + "</span></div>"
        : "";
      // built-in note + optional custom challenge
      const noteBlock = game.note
        ? '<div class="note">' + escapeHtml(game.note) + "</div>"
        : "";
      const customBlock = challenge
        ? '<div class="custom-challenge"><span class="tag">Challenge</span>' + escapeHtml(challenge) + "</div>"
        : "";

      const sparks = compact
        ? ""
        : '<span class="spark" style="top:18%;left:42%"></span><span class="spark s2" style="top:70%;left:58%"></span><span class="spark s3" style="top:40%;right:12%"></span>';

      return (
        '<div class="game-overlay ' + (compact ? "compact" : "") + '" data-flair="' + th.flair + '" style="' +
        "--g-primary:" + th.primary +
        ";--g-primary-dim:" + th.primaryDim +
        ";--g-accent:" + th.accent +
        ";--g-surface:" + th.surface +
        ";--g-panel:" + th.panel +
        ";--g-fg:" + th.fg +
        ";--g-muted:" + th.muted +
        ";--g-glow:" + th.glow +
        ";--g-radius:" + shapeRadius[th.shape] +
        ";--g-letter-radius:" + letterRadius[th.shape] +
        '">' +
        flairHTML(th.flair) +
        '<div class="scanlines"></div><div class="shine"></div>' + sparks +
        '<div class="letter-box"><span>' + letter + "</span></div>" +
        '<div class="cover" style="border-radius:' + coverR + '">' + coverInner + "</div>" +
        '<div class="info">' +
        '<div class="progress-label">' + num + " / 26" +
        (th.flair === "military" ? '<span class="ops">// OPS</span>' : "") +
        "</div>" +
        '<div class="' + titleClass + '">' + escapeHtml(game.title) + "</div>" +
        noteBlock +
        customBlock +
        timerBlock +
        '<div class="bar" style="border-radius:' + barR + '"><div class="bar-fill" style="width:' + pct + '%;border-radius:inherit"></div></div>' +
        "</div></div>"
      );
    }

    function startTicking() {
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(function () {
        document.querySelectorAll(".run-clock, .control-run-clock").forEach(function (el) {
          const start = parseInt(el.getAttribute("data-run-start"), 10);
          if (!start) {
            if (el.classList.contains("control-run-clock")) el.textContent = "00:00:00";
            return;
          }
          el.textContent = formatDuration(Date.now() - start * 1000);
        });
      }, 250);
    }

    function setParams(letter, pick, mode, runStart, challenge) {
      const cur = getParams();
      if (runStart === undefined) runStart = cur.runStart;
      if (challenge === undefined) challenge = cur.challenge;
      const u = new URL(location.href);
      u.searchParams.set("letter", letter);
      if (pick > 0) u.searchParams.set("pick", String(pick));
      else u.searchParams.delete("pick");
      const opts = DATA[letter];
      if (opts && opts[pick]) u.searchParams.set("game", opts[pick].id);
      if (mode === "overlay") u.searchParams.set("mode", "overlay");
      else u.searchParams.delete("mode");
      applyRunStartToUrl(u, runStart);
      applyChallengeToUrl(u, challenge);
      history.replaceState(null, "", u);
      render();
    }

    function runStartFromElapsed(h, m, s) {
      const total = (Math.max(0, h|0) * 3600) + (Math.max(0, m|0) * 60) + Math.max(0, s|0);
      return Math.floor(Date.now() / 1000) - total;
    }

    function render() {
      const { letter, pick, mode, runStart, challenge } = getParams();
      const opts = DATA[letter];
      const game = opts[pick];
      const app = document.getElementById("app");

      if (mode === "overlay") {
        document.body.className = "overlay-mode";
        document.documentElement.style.background = "transparent";
        app.innerHTML = overlayHTML(letter, game, false, runStart, challenge);
        startTicking();
        return;
      }

      document.body.className = "";
      document.documentElement.style.background = "";
      const idx = LETTERS.indexOf(letter);
      const obs = new URL(location.href);
      obs.searchParams.set("letter", letter);
      if (pick > 0) obs.searchParams.set("pick", String(pick));
      else obs.searchParams.delete("pick");
      obs.searchParams.set("game", game.id);
      obs.searchParams.set("mode", "overlay");
      applyRunStartToUrl(obs, runStart);
      applyChallengeToUrl(obs, challenge);
      const obsStr = obs.toString();

      let picksHtml = "";
      if (opts.length > 1) {
        picksHtml =
          '<div class="picks">' +
          opts.map(function (o, i) {
            const active = i === pick ? " active" : "";
            const label = o.note ? o.title + " — " + o.note : o.title;
            return (
              '<button type="button" class="pick-btn' + active + '" data-pick="' + i +
              '" style="--pick:' + o.theme.primary + '">' + escapeHtml(label) + "</button>"
            );
          }).join("") +
          "</div>";
      }

      const clockVal = runStart ? formatDuration(Date.now() - runStart * 1000) : "00:00:00";
      // prefill elapsed from current runStart
      let eh = 0, em = 0, es = 0;
      if (runStart) {
        const totalSec = Math.max(0, Math.floor(Date.now() / 1000 - runStart));
        eh = Math.floor(totalSec / 3600);
        em = Math.floor((totalSec % 3600) / 60);
        es = totalSec % 60;
      }

      const timerHtml =
        '<div class="timer-card">' +
        '<div class="timer-head">' +
        '<div><div class="field-hint" style="margin-bottom:4px">Whole-run total (this stream only)</div>' +
        '<div class="clock control-run-clock" data-run-start="' + (runStart || "") + '">' + clockVal + "</div></div>" +
        '<div class="timer-actions" style="margin-left:auto">' +
        '<button type="button" class="primary" id="startRun" style="background:' + game.theme.primary + '">' +
        (runStart ? "Restart from 0" : "Start now") + "</button>" +
        (runStart ? '<button type="button" id="clearRun">Clear</button>' : "") +
        "</div></div>" +
        '<div class="elapsed-row">' +
        '<label>Hours<input id="eh" type="number" min="0" max="999" value="' + eh + '" /></label>' +
        '<label>Mins<input id="em" type="number" min="0" max="59" value="' + em + '" /></label>' +
        '<label>Secs<input id="es" type="number" min="0" max="59" value="' + es + '" /></label>' +
        '<button type="button" class="primary" id="applyElapsed" style="background:' + game.theme.primary + ';height:42px">Set time already in</button>' +
        "</div>" +
        '<p class="field-hint" style="margin-top:8px">Already a few hours in? Type the time so far and hit <strong>Set time already in</strong>, then re-copy the OBS URL.</p>' +
        "</div>";

      const challengeHtml =
        '<div class="challenge-card">' +
        '<label for="challengeInput">Custom challenge (optional)</label>' +
        '<input id="challengeInput" type="text" maxlength="120" placeholder="e.g. Win 3 ranked matches without dying" value="' +
        escapeHtml(challenge) + '" />' +
        '<div class="timer-actions">' +
        '<button type="button" class="primary" id="applyChallenge" style="background:' + game.theme.primary + '">Apply challenge</button>' +
        '<button type="button" id="clearChallenge">Clear</button>' +
        "</div>" +
        '<p class="field-hint" style="margin-top:8px">Optional. Shows under the game title on the overlay. Leave blank if you only want the built-in note (like Black Ops trickshot).</p>' +
        "</div>";

      app.innerHTML =
        '<div class="control">' +
        "<header>" +
        '<div class="badge">A–Z Marathon</div>' +
        "<h1>Streamer control</h1>" +
        '<p class="lead">Pick a letter, set total run time (even if you already started hours ago), optionally add a challenge line, then copy the OBS URL. Each streamer’s timer is only in their own OBS link.</p>' +
        "</header>" +
        '<div class="grid">' +
        '<section class="card">' +
        '<div class="row"><div><h2>Live preview</h2>' +
        '<div class="hint" style="margin:0">Theme: <span style="color:' + game.theme.primary + '">' + game.theme.flair + "</span></div></div>" +
        '<div class="nav-btns">' +
        '<button class="icon-btn" id="prev" ' + (idx <= 0 ? "disabled" : "") + ' aria-label="Previous">‹</button>' +
        '<button class="icon-btn" id="next" ' + (idx >= 25 ? "disabled" : "") + ' aria-label="Next">›</button>' +
        "</div></div>" +
        timerHtml +
        challengeHtml +
        picksHtml +
        '<div class="preview-wrap" style="background:radial-gradient(ellipse at center, color-mix(in srgb, ' + game.theme.primary + ' 18%, transparent), transparent 70%)">' +
        overlayHTML(letter, game, true, runStart, challenge) +
        "</div>" +
        '<div class="url-row">' +
        '<div class="url-box"><code id="urlText">' + escapeHtml(obsStr) + "</code></div>" +
        '<button class="copy-btn" id="copy" style="background:' + game.theme.primary + '">Copy OBS URL</button>' +
        "</div>" +
        '<p class="hint">OBS → Browser Source → paste URL → ~900×300 → transparent. After changing timer or challenge, <strong>copy again</strong> so OBS gets the new URL.</p>' +
        "</section>" +
        '<section class="card"><h2 style="margin-bottom:14px">All letters</h2><div class="letters" id="letters"></div></section>' +
        "</div>" +
        '<section class="card how"><h2 style="margin-bottom:10px">Quick tips</h2><ol>' +
        "<li><strong>Set time already in</strong> if the marathon started hours ago.</li>" +
        "<li><strong>Custom challenge</strong> is optional — only shows if you fill it in.</li>" +
        "<li>Timer lives in the OBS URL (<code>runStart</code>). Other streamers do not affect yours.</li>" +
        "<li><strong>D</strong> / <strong>E</strong> have multiple game options.</li>" +
        "</ol></section></div>";

      const lettersEl = document.getElementById("letters");
      LETTERS.forEach(function (L) {
        const options = DATA[L];
        const g0 = options[0];
        const active = L === letter;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "letter-btn";
        b.style.borderColor = active ? g0.theme.primary : "var(--border)";
        b.style.background = active ? "color-mix(in srgb, " + g0.theme.primary + " 18%, #0a0e18)" : "var(--bg)";
        b.style.boxShadow = active ? "0 0 14px color-mix(in srgb, " + g0.theme.glow + " 35%, transparent)" : "";
        const title = options.length > 1
          ? options.map(function (o) { return o.title; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(" / ")
          : g0.title;
        b.innerHTML =
          '<strong style="color:' + (active ? g0.theme.primary : g0.theme.fg) + '">' + L +
          "</strong><span>" + escapeHtml(title) + "</span>" +
          (options.length > 1 ? '<span class="multi">' + options.length + " options</span>" : "");
        b.onclick = function () { setParams(L, 0, "control", runStart, challenge); };
        lettersEl.appendChild(b);
      });

      document.querySelectorAll(".pick-btn").forEach(function (btn) {
        btn.onclick = function () {
          setParams(letter, parseInt(btn.getAttribute("data-pick"), 10), "control", runStart, challenge);
        };
      });

      document.getElementById("prev").onclick = function () {
        if (idx <= 0) return;
        setParams(LETTERS[idx - 1], 0, "control", runStart, challenge);
      };
      document.getElementById("next").onclick = function () {
        if (idx >= 25) return;
        setParams(LETTERS[idx + 1], 0, "control", runStart, challenge);
      };
      document.getElementById("copy").onclick = async function () {
        try {
          await navigator.clipboard.writeText(obsStr);
          const btn = document.getElementById("copy");
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = "Copy OBS URL"; }, 1400);
        } catch (e) {
          prompt("Copy this OBS URL:", obsStr);
        }
      };

      document.getElementById("startRun").onclick = function () {
        const now = Math.floor(Date.now() / 1000);
        writeStoredRunStart(now);
        setParams(letter, pick, "control", now, challenge);
      };
      const clearRun = document.getElementById("clearRun");
      if (clearRun) {
        clearRun.onclick = function () {
          writeStoredRunStart(null);
          setParams(letter, pick, "control", null, challenge);
        };
      }
      document.getElementById("applyElapsed").onclick = function () {
        const h = parseInt(document.getElementById("eh").value, 10) || 0;
        const m = parseInt(document.getElementById("em").value, 10) || 0;
        const s = parseInt(document.getElementById("es").value, 10) || 0;
        const rs = runStartFromElapsed(h, m, s);
        writeStoredRunStart(rs);
        setParams(letter, pick, "control", rs, challenge);
      };
      document.getElementById("applyChallenge").onclick = function () {
        const text = (document.getElementById("challengeInput").value || "").trim().slice(0, 120);
        writeStoredChallenge(text);
        setParams(letter, pick, "control", runStart, text);
      };
      document.getElementById("clearChallenge").onclick = function () {
        writeStoredChallenge("");
        document.getElementById("challengeInput").value = "";
        setParams(letter, pick, "control", runStart, "");
      };

      startTicking();
    }

    render();
  </script>
</body>
</html>
