<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A–Z Marathon Overlay</title>
  <style>
    :root {
      --bg: #070a12;
      --surface: #0e1422;
      --fg: #e8f0ff;
      --muted: #7a8aa8;
      --border: #1e2a42;
      --primary: #00c6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    body.overlay-mode {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    button { cursor: pointer; font: inherit; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Control layout */
    .control {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin-top: 8px; max-width: 36rem; line-height: 1.5; }
    .grid {
      display: grid;
      gap: 20px;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1.15fr 0.85fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .row h2 { font-size: 1.1rem; }
    .nav-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #141c2e;
      color: var(--fg);
      display: grid; place-items: center;
      font-size: 18px;
    }
    .icon-btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); }
    .preview-wrap {
      display: flex;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 180px;
      align-items: center;
    }
    .url-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .url-row { flex-direction: row; }
    }
    .url-box {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .url-box code {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #dce8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .copy-btn {
      height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      color: #071018;
      white-space: nowrap;
    }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .letters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 480px) {
      .letters { grid-template-columns: repeat(5, 1fr); }
    }
    .letter-btn {
      min-height: 52px;
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 8px 10px;
      color: var(--fg);
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .letter-btn strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }
    .letter-btn span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .how ol {
      margin-left: 1.2rem;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .how code {
      background: var(--bg);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    /* Overlay card */
    .game-overlay {
      position: relative;
      display: flex;
      align-items: center;
      gap: 28px;
      width: min(920px, 100%);
      padding: 22px 32px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 35%, transparent);
      border-radius: var(--g-radius, 18px);
      background: color-mix(in srgb, var(--g-surface) 92%, transparent);
      color: var(--g-fg);
      box-shadow:
        0 0 40px color-mix(in srgb, var(--g-glow) 18%, transparent),
        inset 0 0 30px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      animation: fadeUp .55s ease-out both;
    }
    .game-overlay.compact {
      gap: 16px;
      padding: 14px 20px;
      max-width: 720px;
    }
    .game-overlay[data-flair="military"]::before,
    .game-overlay[data-flair="military"]::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--g-primary);
      pointer-events: none;
      z-index: 2;
    }
    .game-overlay[data-flair="military"]::before {
      top: 6px; left: 6px;
      border-top: 2px solid; border-left: 2px solid;
    }
    .game-overlay[data-flair="military"]::after {
      right: 6px; bottom: 6px;
      border-right: 2px solid; border-bottom: 2px solid;
    }
    .flair-layer {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .letter-box {
      position: relative; z-index: 1;
      flex-shrink: 0;
      display: grid; place-items: center;
      width: 110px; height: 110px;
      border: 2px solid color-mix(in srgb, var(--g-primary) 55%, transparent);
      border-radius: var(--g-letter-radius, 16px);
      background: linear-gradient(145deg, var(--g-panel), color-mix(in srgb, var(--g-surface) 80%, black));
      box-shadow: 0 0 24px color-mix(in srgb, var(--g-glow) 40%, transparent);
      animation: pulseGlow 2.8s ease-in-out infinite;
    }
    .compact .letter-box { width: 80px; height: 80px; }
    .letter-box span {
      font-weight: 800;
      font-size: 4.8rem;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--g-primary) 70%, white), var(--g-primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--g-glow) 50%, transparent));
    }
    .compact .letter-box span { font-size: 3.2rem; }
    .cover {
      position: relative; z-index: 1;
      flex-shrink: 0;
      width: 130px; height: 174px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--g-primary) 25%, transparent);
      box-shadow: 0 8px 24px rgba(0,0,0,.55);
      background: var(--g-panel);
      animation: floatY 4s ease-in-out infinite;
    }
    .compact .cover { width: 90px; height: 120px; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover .ph {
      width: 100%; height: 100%;
      display: grid; place-items: center;
      font-size: 2.5rem; font-weight: 800;
      color: color-mix(in srgb, var(--g-primary) 40%, transparent);
      background: linear-gradient(160deg, var(--g-panel), var(--g-surface));
    }
    .info {
      position: relative; z-index: 1;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .progress-label {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--g-primary) 90%, white);
    }
    .progress-label .ops {
      margin-left: 8px;
      opacity: 0.7;
      color: var(--g-muted);
      font-weight: 500;
    }
    .title {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--g-fg);
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .compact .title { font-size: 1.2rem; }
    .title.comic { font-style: italic; letter-spacing: 0.02em; }
    .title.pixel { text-transform: uppercase; letter-spacing: -0.02em; }
    .note {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--g-accent);
    }
    .bar {
      margin-top: 10px;
      height: 6px;
      width: 100%;
      overflow: hidden;
      background: color-mix(in srgb, var(--g-fg) 10%, transparent);
    }
    .bar-fill {
      height: 100%;
      transition: width .7s ease;
      background: linear-gradient(90deg, var(--g-primary), var(--g-primary-dim));
      box-shadow: 0 0 12px color-mix(in srgb, var(--g-glow) 55%, transparent);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--g-glow) 35%, transparent); }
      50% { box-shadow: 0 0 32px color-mix(in srgb, var(--g-glow) 60%, transparent); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-overlay, .letter-box, .cover { animation: none !important; }
    }
  </style>
</head>

    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const shapeRadius = { sharp: "8px", soft: "18px", pill: "28px" };
    const letterRadius = { sharp: "6px", soft: "16px", pill: "999px" };

    function getParams() {
      const p = new URLSearchParams(location.search);
      let letter = (p.get("letter") || "B").toUpperCase();
      if (!GAMES[letter]) letter = "B";
      const mode = p.get("mode") === "overlay" ? "overlay" : "control";
      return { letter, mode };
    }

    function progressOf(letter) {
      const num = LETTERS.indexOf(letter) + 1;
      return { num, pct: (num / 26) * 100 };
    }

    function flairHTML(flair) {
      if (flair === "military") {
        return `<div class="flair-layer" style="opacity:.07;background-image:repeating-linear-gradient(-45deg,var(--g-primary) 0 1px,transparent 1px 8px)"></div>
                <div class="flair-layer" style="width:6px;right:auto;background:var(--g-primary);opacity:1"></div>`;
      }
      if (flair === "neon") {
        return `<div class="flair-layer" style="opacity:.4;background:radial-gradient(ellipse at 20% 50%, color-mix(in srgb, var(--g-primary) 25%, transparent), transparent 55%)"></div>`;
      }
      if (flair === "energy") {
        return `<div class="flair-layer" style="opacity:.3;background:radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--g-accent) 35%, transparent), transparent 40%), radial-gradient(circle at 10% 80%, color-mix(in srgb, var(--g-primary) 30%, transparent), transparent 45%)"></div>`;
      }
      if (flair === "pixel") {
        return `<div class="flair-layer" style="opacity:.12;background-image:linear-gradient(var(--g-primary) 1px, transparent 1px), linear-gradient(90deg, var(--g-primary) 1px, transparent 1px);background-size:12px 12px"></div>`;
      }
      if (flair === "fantasy") {
        return `<div class="flair-layer" style="opacity:.25;background:linear-gradient(135deg, color-mix(in srgb, var(--g-primary) 20%, transparent), transparent 40%, color-mix(in srgb, var(--g-accent) 15%, transparent))"></div>`;
      }
      if (flair === "comic") {
        return `<div class="flair-layer" style="opacity:.14;background-image:radial-gradient(var(--g-primary) 1px, transparent 1px);background-size:10px 10px"></div>`;
      }
      if (flair === "naval") {
        return `<div class="flair-layer" style="opacity:.2;background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--g-primary) 18%, transparent))"></div>`;
      }
      return "";
    }

    function overlayHTML(game, compact) {
      const th = game.theme;
      const { num, pct } = progressOf(game.letter);
      const coverR = th.shape === "pill" ? "14px" : th.shape === "sharp" ? "4px" : "10px";
      const barR = th.shape === "sharp" ? "2px" : "999px";
      const titleClass = th.flair === "comic" ? "title comic" : th.flair === "pixel" ? "title pixel" : "title";
      const coverInner = game.img
        ? `<img src="${game.img}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" /><div class="ph" style="display:none">${game.letter}</div>`
        : `<div class="ph">${game.letter}</div>`;
      return `
      <div class="game-overlay ${compact ? "compact" : ""}" data-flair="${th.flair}" style="
        --g-primary:${th.primary};
        --g-primary-dim:${th.primaryDim};
        --g-accent:${th.accent};
        --g-surface:${th.surface};
        --g-panel:${th.panel};
        --g-fg:${th.fg};
        --g-muted:${th.muted};
        --g-glow:${th.glow};
        --g-radius:${shapeRadius[th.shape]};
        --g-letter-radius:${letterRadius[th.shape]};
      ">
        ${flairHTML(th.flair)}
        <div class="letter-box"><span>${game.letter}</span></div>
        <div class="cover" style="border-radius:${coverR}">${coverInner}</div>
        <div class="info">
          <div class="progress-label">${num} / 26${th.flair === "military" ? '<span class="ops">// OPS</span>' : ""}</div>
          <div class="${titleClass}">${escapeHtml(game.title)}</div>
          ${game.note ? `<div class="note">${escapeHtml(game.note)}</div>` : ""}
          <div class="bar" style="border-radius:${barR}"><div class="bar-fill" style="width:${pct}%;border-radius:inherit"></div></div>
        </div>
      </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({"&":"&","<":"<",">":">",'"':""","'":"&#39;"}[c]));
    }

    function render() {
      const { letter, mode } = getParams();
      const game = GAMES[letter];
      const app = document.getElementById("app");

      if (mode === "overlay") {
        document.body.className = "overlay-mode";
        document.documentElement.style.background = "transparent";
        app.innerHTML = overlayHTML(game, false);
        return;
      }

      document.body.className = "";
      document.documentElement.style.background = "";
      const idx = LETTERS.indexOf(letter);
      const overlayPath = `?letter=${letter}&mode=overlay`;
      const fullUrl = location.origin + location.pathname.replace(/\/?$/, "/") + overlayPath.replace(/^\?/, "?");
      // cleaner URL
      const base = location.href.split("?")[0].replace(/index\.html$/, "");
      const obsUrl = base + (base.endsWith("/") ? "" : "/") + `?letter=${letter}&mode=overlay`.replace(/^\//, "");
      // Fix: path-based
      const obs = new URL(location.href);
      obs.search = `?letter=${letter}&mode=overlay`;
      const obsStr = obs.toString();

      app.innerHTML = `
        <div class="control">
          <header>
            <div class="badge">A–Z Marathon</div>
            <h1>Streamer control</h1>
            <p class="lead">Each game has its own themed overlay. Pick a letter, preview it, copy the OBS Browser Source URL. Other streamers can use this same page.</p>
          </header>
          <div class="grid">
            <section class="card">
              <div class="row">
                <div>
                  <h2>Live preview</h2>
                  <div class="hint" style="margin:0">Theme: <span style="color:${game.theme.primary}">${game.theme.flair}</span></div>
                </div>
                <div class="nav-btns">
                  <button class="icon-btn" id="prev" ${idx<=0?"disabled":""} aria-label="Previous">‹</button>
                  <button class="icon-btn" id="next" ${idx>=25?"disabled":""} aria-label="Next">›</button>
                </div>
              </div>
              <div class="preview-wrap" style="background:radial-gradient(ellipse at center, color-mix(in srgb, ${game.theme.primary} 14%, transparent), transparent 70%)">
                ${overlayHTML(game, true)}
              </div>
              <div class="url-row">
                <div class="url-box"><code id="urlText">${escapeHtml(obsStr)}</code></div>
                <button class="copy-btn" id="copy" style="background:${game.theme.primary}">Copy OBS URL</button>
              </div>
              <p class="hint">OBS → Add Browser Source → paste URL → width ~900, height ~280 → enable transparent background.</p>
            </section>
            <section class="card">
              <h2 style="margin-bottom:14px">All letters</h2>
              <div class="letters" id="letters"></div>
            </section>
          </div>
          <section class="card how">
            <h2 style="margin-bottom:10px">For other streamers</h2>
            <ol>
              <li>Open this control page and pick their current letter.</li>
              <li>Copy the OBS URL (includes <code>?letter=X&mode=overlay</code>).</li>
              <li>Paste as a Browser Source in OBS. To advance, change the letter here or edit <code>?letter=</code> in OBS.</li>
              <li>Each game auto-styles itself (Black Ops green, Apex red, Valorant crimson, etc.).</li>
            </ol>
          </section>
        </div>`;

      const lettersEl = document.getElementById("letters");
      LETTERS.forEach((L) => {
        const g = GAMES[L];
        const active = L === letter;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "letter-btn";
        b.style.borderColor = active ? g.theme.primary : "var(--border)";
        b.style.background = active ? `color-mix(in srgb, ${g.theme.primary} 18%, #0a0e18)` : "var(--bg)";
        b.style.boxShadow = active ? `0 0 14px color-mix(in srgb, ${g.theme.glow} 35%, transparent)` : "";
        b.innerHTML = `<strong style="color:${active ? g.theme.primary : g.theme.fg}">${L}</strong><span>${escapeHtml(g.title)}</span>`;
        b.onclick = () => {
          const u = new URL(location.href);
          u.searchParams.set("letter", L);
          u.searchParams.delete("mode");
          history.replaceState(null, "", u);
          render();
        };
        lettersEl.appendChild(b);
      });

      document.getElementById("prev").onclick = () => {
        if (idx <= 0) return;
        const u = new URL(location.href);
        u.searchParams.set("letter", LETTERS[idx - 1]);
        history.replaceState(null, "", u);
        render();
      };
      document.getElementById("next").onclick = () => {
        if (idx >= 25) return;
        const u = new URL(location.href);
        u.searchParams.set("letter", LETTERS[idx + 1]);
        history.replaceState(null, "", u);
        render();
      };
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(obsStr);
          const btn = document.getElementById("copy");
          btn.textContent = "Copied";
          setTimeout(() => { btn.textContent = "Copy OBS URL"; }, 1400);
        } catch {
          prompt("Copy this OBS URL:", obsStr);
        }
      };
    }

    render();
  </script>
</body>
</html>
